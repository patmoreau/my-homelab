name: Configure Branch Ruleset

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/configure-branch-ruleset.yml

# Source of truth for the "main" branch ruleset.
#
# Approvals are required for everyone except the two bypass actors:
#   - Repository admin role (id 5)  -> the codeowner, who cannot approve their own PRs
#   - Renovate GitHub App (id 2740) -> "pull_request" mode, so it may merge its own PRs
#     without a review but still cannot push straight to main. Combined with
#     `automerge` in renovate.json, dependency PRs merge on their own once checks pass.
env:
  RULESET_NAME: main
  RENOVATE_APP_ID: 2740
  ADMIN_ROLE_ID: 5

jobs:
  configure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Apply main branch ruleset
        env:
          GH_TOKEN: ${{ secrets.ADMIN_PAT }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"

          # Fail loudly on a bad/expired ADMIN_PAT instead of feeding the 401 body
          # into the ruleset id, which is what the old `|| true` lookup used to do.
          RULESETS=$(gh api "repos/$REPO/rulesets")
          EXISTING_ID=$(jq -r --arg n "$RULESET_NAME" \
            '.[] | select(.name == $n) | .id' <<< "$RULESETS")

          PAYLOAD=$(cat <<EOF
          {
            "name": "$RULESET_NAME",
            "target": "branch",
            "enforcement": "active",
            "conditions": {
              "ref_name": {
                "include": ["~DEFAULT_BRANCH"],
                "exclude": []
              }
            },
            "bypass_actors": [
              {
                "actor_id": $ADMIN_ROLE_ID,
                "actor_type": "RepositoryRole",
                "bypass_mode": "always"
              },
              {
                "actor_id": $RENOVATE_APP_ID,
                "actor_type": "Integration",
                "bypass_mode": "pull_request"
              }
            ],
            "rules": [
              { "type": "deletion" },
              { "type": "non_fast_forward" },
              {
                "type": "pull_request",
                "parameters": {
                  "required_approving_review_count": 1,
                  "dismiss_stale_reviews_on_push": false,
                  "require_code_owner_review": true,
                  "require_last_push_approval": false,
                  "required_review_thread_resolution": false,
                  "require_extra_approval_for_unattributed_changes": true,
                  "allowed_merge_methods": ["squash"]
                }
              }
            ]
          }
          EOF
          )

          if [ -n "$EXISTING_ID" ]; then
            echo "Updating existing ruleset (id: $EXISTING_ID)..."
            gh api --method PUT "repos/$REPO/rulesets/$EXISTING_ID" --input - <<< "$PAYLOAD"
          else
            echo "Creating new ruleset..."
            gh api --method POST "repos/$REPO/rulesets" --input - <<< "$PAYLOAD"
          fi
