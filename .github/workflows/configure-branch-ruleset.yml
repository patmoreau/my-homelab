name: Configure Branch Ruleset

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/configure-branch-ruleset.yml

# Source of truth for the "main" branch ruleset.
#
# Approvals are required for everyone except the two bypass actors:
#   - Repository admin role (id 5)  -> the codeowner, who cannot approve their own PRs
#   - Renovate GitHub App (id 2740) -> "always" mode, so its own PRs merge without a
#     review. Combined with `automerge` in renovate.json, dependency PRs merge on
#     their own once checks pass.
#
# "always" rather than the tighter "pull_request": with "pull_request" mode, PR #25
# sat at BLOCKED / REVIEW_REQUIRED with auto-merge armed and ansible-lint green and
# never merged. GitHub's native auto-merge weighs the branch's requirements instead
# of crediting the enabling actor's bypass, so the narrower mode does not apply here.
# Renovate only ever works through a branch and a PR, so allowing direct pushes it
# will not make costs nothing in practice.
#
# `ansible-lint` is required to pass. Renovate's bypass covers the review
# requirement, NOT this one: bypassing a pull_request rule does not waive status
# checks, so a red lint still blocks a Renovate merge. That is the point.
# `strict_required_status_checks_policy` stays false — forcing every PR to be
# rebased onto the newest main first would put Renovate in a rebase loop.
env:
  RULESET_NAME: main
  RENOVATE_APP_ID: 2740
  ADMIN_ROLE_ID: 5
  ACTIONS_APP_ID: 15368 # github-actions app; pins who may report "ansible-lint"

jobs:
  configure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Apply main branch ruleset
        env:
          GH_TOKEN: ${{ secrets.ADMIN_PAT }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"

          # Fail loudly on a bad/expired ADMIN_PAT instead of feeding the 401 body
          # into the ruleset id, which is what the old `|| true` lookup used to do.
          RULESETS=$(gh api "repos/$REPO/rulesets")
          EXISTING_ID=$(jq -r --arg n "$RULESET_NAME" \
            '.[] | select(.name == $n) | .id' <<< "$RULESETS")

          PAYLOAD=$(cat <<EOF
          {
            "name": "$RULESET_NAME",
            "target": "branch",
            "enforcement": "active",
            "conditions": {
              "ref_name": {
                "include": ["~DEFAULT_BRANCH"],
                "exclude": []
              }
            },
            "bypass_actors": [
              {
                "actor_id": $ADMIN_ROLE_ID,
                "actor_type": "RepositoryRole",
                "bypass_mode": "always"
              },
              {
                "actor_id": $RENOVATE_APP_ID,
                "actor_type": "Integration",
                "bypass_mode": "always"
              }
            ],
            "rules": [
              { "type": "deletion" },
              { "type": "non_fast_forward" },
              {
                "type": "pull_request",
                "parameters": {
                  "required_approving_review_count": 1,
                  "dismiss_stale_reviews_on_push": false,
                  "require_code_owner_review": true,
                  "require_last_push_approval": false,
                  "required_review_thread_resolution": false,
                  "require_extra_approval_for_unattributed_changes": true,
                  "allowed_merge_methods": ["squash"]
                }
              },
              {
                "type": "required_status_checks",
                "parameters": {
                  "strict_required_status_checks_policy": false,
                  "do_not_enforce_on_create": false,
                  "required_status_checks": [
                    {
                      "context": "ansible-lint",
                      "integration_id": $ACTIONS_APP_ID
                    }
                  ]
                }
              }
            ]
          }
          EOF
          )

          if [ -n "$EXISTING_ID" ]; then
            echo "Updating existing ruleset (id: $EXISTING_ID)..."
            gh api --method PUT "repos/$REPO/rulesets/$EXISTING_ID" --input - <<< "$PAYLOAD"
          else
            echo "Creating new ruleset..."
            gh api --method POST "repos/$REPO/rulesets" --input - <<< "$PAYLOAD"
          fi
