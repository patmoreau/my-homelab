ansible_user: root
ansible_ssh_private_key_file: ~/.ssh/terraform_homelab
ansible_python_interpreter: /usr/bin/python3

# Container runtime for a host: 'docker' (default) or 'podman'.
# Podman hosts deploy services as Quadlet systemd units instead of Compose stacks.
container_runtime: docker

docker_compose_dir: /opt/docker
nas_puid: 0
nas_pgid: 0
timezone: 'America/Montreal'
traefik_acme_email: 'patrick@drifterapps.com'
pbs_domain: 'pbs.moreaulab.ca'
# Auth0 SSO front door (oauth2-proxy on lxc-gateway). Shared because two roles need it:
# oauth2-proxy builds its redirect URL from it, traefik points forwardAuth at it.
oauth2_proxy_domain: 'auth.moreaulab.ca'
oauth2_proxy_port: 4180
# Auth0 tenant. Shared for the same reason: grafana builds its sign-out chain from it.
oauth2_proxy_issuer_url: 'https://dev-vx1jio3owhaqdmqa.ca.auth0.com/'
# Where a completed sign-out lands. Must be in the Auth0 app's Allowed Logout URLs.
oauth2_proxy_logout_return_url: 'https://home.moreaulab.ca'
proxmox_domain: 'pve.moreaulab.ca'
proxmox_node: 'homelab'

# Grafana alerts are delivered to Home Assistant through a webhook, which then
# pushes a notification to the phone. Both the Grafana contact point and the
# Home Assistant automation need the same webhook id.
grafana_alert_webhook_id: '{{ vault_grafana_alert_webhook_id }}'
homeassistant_notify_service: 'notify.mobile_app_patrick_moreaus_iphone'

pbs_prune_schedule: 'daily'
pbs_gc_schedule: 'daily'
pbs_prune_keep_last: 7
pbs_prune_keep_daily: 14
pbs_prune_keep_weekly: 8
pbs_prune_keep_monthly: 6
