# lxc-essere runs rootful Podman. postgres + directus + essere-app share one netns
# (postgres owns it, publishes 8055 + 3000); Directus reaches the DB over 127.0.0.1.
# The essere-app image comes from ghcr on a rolling tag and updates via `podman
# auto-update`, run by the essere CI deploy job on the self-hosted runner below.
container_runtime: podman

# Self-hosted GitHub Actions runner for patmoreau/essere.
github_runner_repo: essere
github_runner_labels: "self-hosted,essere,lxc"

# GHCR pull auth falls back to vault_github_runner_pat (role default), which must carry
# read:packages. To use a dedicated token instead, add vault_essere_ghcr_pat to the vault
# and uncomment:
# essere_ghcr_pat: "{{ vault_essere_ghcr_pat }}"

admin_email: patrick@drifterapps.com
admin_password: '{{ vault_essere_admin_password }}'
directus_secret: '{{ vault_essere_directus_secret }}'
mail_api_key: '{{ vault_mail_api_key }}'
postgres_db: directus
postgres_user: '{{ vault_essere_postgres_user }}'
postgres_password: '{{ vault_essere_postgres_password }}'
cloudflare_turnstile_secret_key: '{{ vault_cloudflare_turnstile_secret_key }}'

# Umami analytics reuses the essere Postgres above (its own `umami` database, same
# superuser) and gets its own netns, so it needs the DB reachable by IP.
umami_app_secret: '{{ vault_umami_app_secret }}'
# Also set here (not just in the role defaults) so the traefik role on lxc-gateway can
# read it out of hostvars when building the analytics.moreaulab.ca backend URL.
umami_port: 3001
