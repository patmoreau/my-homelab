# lxc-media runs rootful Podman instead of Docker. Services deploy as Quadlet units;
# book-orbit runs app+postgres netns-shared, service-watcher builds its image via
# `podman build` (Quadlet has no build on podman 4.9).
container_runtime: podman

nas_puid: 3000
nas_pgid: 100

service_watcher_qnap_ip: 192.168.50.1
service_watcher_targets: ''
bookorbit_postgres_password: '{{ vault_bookorbit_postgres_password }}'
bookorbit_jwt_token: '{{ vault_bookorbit_jwt_token }}'
bookorbit_setup_bootstrap_token: '{{ vault_bookorbit_setup_bootstrap_token }}'
bookorbit_book_request_encryption_key: '{{ vault_bookorbit_book_request_encryption_key }}'
# BookOrbit's admin API is JWT-only, so the role signs in as this account to register the
# Prowlarr connection and the Transmission client. Leave either blank and that step is
# skipped; the rest of the role still deploys.
bookorbit_admin_user: '{{ vault_bookorbit_admin_user }}'
bookorbit_admin_password: '{{ vault_bookorbit_admin_password }}'

# Instance default destination per medium, for a request whose requester named no library.
bookorbit_request_destinations:
  ebook:
    library: Livres
    folder: /books/books
  audiobook:
    library: Audiobooks
    folder: /books/audiobooks
  comic:
    library: Bandes dessinées
    folder: /books/comics
