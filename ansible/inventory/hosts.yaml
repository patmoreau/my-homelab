all:
  children:
    hypervisors:
      hosts:
        nas:
          ansible_host: 192.168.8.109
        pve-homelab:
          ansible_host: 192.168.8.10
          ansible_user: terraform-admin
        router:
          ansible_host: 192.168.8.1

    # Actual Proxmox nodes only. `hypervisors` also holds the NAS and the router, which
    # are not Proxmox and cannot answer the PVE API — the prometheus pve job looped over
    # that group and so had two permanently-down targets.
    proxmox_nodes:
      hosts:
        pve-homelab:
    backup_servers:
      hosts:
        lxc-pbs:
          ansible_host: 192.168.8.48

    lxc:
      hosts:
        lxc-gateway:
          ansible_host: 192.168.8.40
        lxc-media:
          ansible_host: 192.168.8.41
        lxc-essere:
          ansible_host: 192.168.8.42
        lxc-monitoring:
          ansible_host: 192.168.8.43
        lxc-tools:
          ansible_host: 192.168.8.44
        lxc-vault:
          ansible_host: 192.168.8.45
        lxc-immich:
          ansible_host: 192.168.8.46
        lxc-homeassistant:
          ansible_host: 192.168.8.47
        lxc-pbs:
