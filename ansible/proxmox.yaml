# Host-level configuration for the Proxmox hypervisor.
# Separate from site.yaml (LXC config) — this manages the physical host itself.
# Run with: ansible-playbook proxmox.yaml
- name: Configure Proxmox hypervisor
  hosts: pve-homelab
  become: true
  roles:
    - pve_repos
    - pve_admin
    - pve_storage
    - pve_nas_idmap
    - pve_tuning
    - nut_server
