- name: Ensure Quadlet directory exists
  ansible.builtin.file:
    path: /etc/containers/systemd
    state: directory
    mode: "0755"

- name: Deploy blackbox_exporter Quadlet unit
  ansible.builtin.template:
    src: blackbox_exporter.container
    dest: /etc/containers/systemd/blackbox_exporter.container
    mode: "0644"
  register: blackbox_quadlet

- name: Start blackbox_exporter
  ansible.builtin.systemd:
    name: blackbox_exporter.service
    # blackbox_exporter reads blackbox.yml only at startup, so a module change needs a restart.
    state: "{{ 'restarted' if (blackbox_quadlet.changed or blackbox_config.changed) else 'started' }}"
    daemon_reload: true
