# The Prowlarr connection and the Transmission download client live in BookOrbit's postgres
# DB, so the admin API is the only way to set them. BookOrbit has no API-key auth — every
# admin route is behind a JWT — so the role signs in first and carries the bearer token.
# Both writes are guarded by a GET, so a hand-tuned row survives a re-run.
- name: Check the book-request encryption key
  ansible.builtin.assert:
    that: bookorbit_book_request_encryption_key is match('^[0-9a-f]{64}$')
    fail_msg: >-
      vault_bookorbit_book_request_encryption_key must be a 64-character hex string
      (openssl rand -hex 32). BookOrbit refuses to store indexer and download-client
      credentials rather than keep them in the clear when the key is missing or malformed.
    quiet: true

- name: Wait for the BookOrbit API
  ansible.builtin.uri:
    url: "{{ bookorbit_api_url }}/auth/setup-status"
    status_code: 200
  register: bookorbit_status
  # A cold start runs the schema migrations before the API answers, so this is minutes of
  # headroom rather than the couple of seconds a restart needs.
  retries: 60
  delay: 5
  until: bookorbit_status is succeeded

# Login is rate-limited to five attempts a minute, so this stays a single call and the
# token is reused by both writes below.
- name: Sign in to BookOrbit
  ansible.builtin.uri:
    url: "{{ bookorbit_api_url }}/auth/login"
    method: POST
    body_format: json
    body:
      username: "{{ bookorbit_admin_user }}"
      password: "{{ bookorbit_admin_password }}"
    status_code: 200
  register: bookorbit_login
  changed_when: false
  no_log: true

- name: Read the configured indexer managers
  ansible.builtin.uri:
    url: "{{ bookorbit_api_url }}/admin/request-indexer-managers"
    headers:
      Authorization: "Bearer {{ bookorbit_login.json.accessToken }}"
  register: bookorbit_indexer_managers
  no_log: true

# Creating the connection also syncs it: BookOrbit pulls Prowlarr's indexer list and keeps
# every one of them as a search source, so which trackers to run stays a Prowlarr decision.
- name: Add Prowlarr as the indexer manager
  ansible.builtin.uri:
    url: "{{ bookorbit_api_url }}/admin/request-indexer-managers"
    method: POST
    headers:
      Authorization: "Bearer {{ bookorbit_login.json.accessToken }}"
    body_format: json
    body:
      name: "{{ bookorbit_prowlarr_name }}"
      type: prowlarr
      baseUrl: "{{ bookorbit_prowlarr_url }}"
      credential: "{{ vault_prowlarr_api_key }}"
      enabled: true
      # BookOrbit refuses RFC1918 targets unless told the hop is deliberate.
      allowPrivateAddress: true
      syncNewIndexers: true
    status_code: [200, 201]
  when: bookorbit_prowlarr_name not in (bookorbit_indexer_managers.json.managers | map(attribute='name') | list)
  changed_when: true
  no_log: true

# Creating the connection syncs it, but on a fresh host that first sync runs before the
# prowlarr role has fixed AllowedHosts, which leaves the manager registered with no sources.
# Re-synced only when the last one did not succeed: doing it every run would report changed
# forever.
- name: Sync the Prowlarr indexers
  vars:
    bookorbit_prowlarr_manager: >-
      {{ (bookorbit_indexer_managers.json.managers | selectattr('name', 'equalto', bookorbit_prowlarr_name) | list | first)
         | default({}, true) }}
  ansible.builtin.uri:
    url: "{{ bookorbit_api_url }}/admin/request-indexer-managers/{{ bookorbit_prowlarr_manager.id }}/sync"
    method: POST
    headers:
      Authorization: "Bearer {{ bookorbit_login.json.accessToken }}"
    status_code: [200, 201]
  when:
    - bookorbit_prowlarr_manager.id is defined
    - not (bookorbit_prowlarr_manager.lastSyncOk | default(false))
  changed_when: true
  no_log: true

- name: Read the configured download clients
  ansible.builtin.uri:
    url: "{{ bookorbit_api_url }}/admin/download-clients"
    headers:
      Authorization: "Bearer {{ bookorbit_login.json.accessToken }}"
  register: bookorbit_download_clients
  no_log: true

# Its own category, so BookOrbit only ever acts on the torrents it added and radarr's and
# sonarr's grabs stay out of its queue.
- name: Add Transmission as the download client
  ansible.builtin.uri:
    url: "{{ bookorbit_api_url }}/admin/download-clients"
    method: POST
    headers:
      Authorization: "Bearer {{ bookorbit_login.json.accessToken }}"
    body_format: json
    body:
      name: "{{ bookorbit_transmission_name }}"
      adapterType: transmission
      baseUrl: "{{ bookorbit_transmission_url }}"
      username: "{{ vault_transmission_user }}"
      password: "{{ vault_transmission_pass }}"
      enabled: true
      priority: 1
      category: "{{ bookorbit_transmission_category }}"
      useHardlinks: "{{ bookorbit_use_hardlinks | bool }}"
      allowPrivateAddress: true
      pathMappings:
        - remotePath: "{{ bookorbit_download_remote_path }}"
          localPath: "{{ bookorbit_download_local_path }}"
    status_code: [200, 201]
  when: bookorbit_transmission_name not in (bookorbit_download_clients.json.clients | map(attribute='name') | list)
  changed_when: true
  no_log: true

# The destination defaults live in app_settings, and the medium each one keys off is the
# only thing known about a request before its file exists — so this is the rung that keeps
# a request from being held purely for having no library to go to.
# Creating the row is guarded by the GET above, which also means a later change to the
# defaults would never reach a client that already exists. Hardlinking in particular flipped
# from false to true once the books export was folded into nas-media, so it is reconciled
# here rather than left to whoever remembers to edit it in the UI. An omitted password keeps
# the stored one and omitted mappings keep the stored ones, so this patch is narrow.
- name: Reconcile the download client settings
  vars:
    bookorbit_client: >-
      {{ (bookorbit_download_clients.json.clients | selectattr('name', 'equalto', bookorbit_transmission_name) | list | first)
         | default({}, true) }}
  ansible.builtin.uri:
    url: "{{ bookorbit_api_url }}/admin/download-clients/{{ bookorbit_client.id }}"
    method: PUT
    headers:
      Authorization: "Bearer {{ bookorbit_login.json.accessToken }}"
    body_format: json
    body:
      useHardlinks: "{{ bookorbit_use_hardlinks | bool }}"
      category: "{{ bookorbit_transmission_category }}"
    status_code: [200, 201]
  when:
    - bookorbit_client.id is defined
    - bookorbit_client.useHardlinks != (bookorbit_use_hardlinks | bool)
  changed_when: true
  no_log: true

- name: Read the libraries
  ansible.builtin.uri:
    url: "{{ bookorbit_api_url }}/libraries"
    headers:
      Authorization: "Bearer {{ bookorbit_login.json.accessToken }}"
  register: bookorbit_libraries
  when: bookorbit_request_destinations | length > 0
  no_log: true

# Named libraries get renamed and folders get moved, and either would otherwise fail deep
# in the next task with a Jinja error about an empty sequence.
- name: Check every destination library and folder exists
  ansible.builtin.assert:
    that:
      - bookorbit_libraries.json | selectattr('name', 'equalto', item.value.library) | list | length == 1
      - item.value.folder is not defined
        or (bookorbit_libraries.json | selectattr('name', 'equalto', item.value.library) | map(attribute='folders')
            | flatten | selectattr('path', 'equalto', item.value.folder) | list | length == 1)
    fail_msg: >-
      No BookOrbit library named "{{ item.value.library }}"
      {{ ('with a folder at ' ~ item.value.folder) if item.value.folder is defined else '' }}
      — check bookorbit_request_destinations against the libraries in the UI.
    quiet: true
  loop: "{{ bookorbit_request_destinations | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: bookorbit_request_destinations | length > 0

- name: Read the request automation settings
  ansible.builtin.uri:
    url: "{{ bookorbit_api_url }}/admin/book-request-automation"
    headers:
      Authorization: "Bearer {{ bookorbit_login.json.accessToken }}"
  register: bookorbit_automation
  when: bookorbit_request_destinations | length > 0
  no_log: true

# Built in one pass and rendered as JSON, then parsed back: a template carrying Jinja
# statements returns a string rather than a dict. Whether it differs is decided in the same
# pass, because a wanted folderId of null means "the library's first folder" — the server
# resolves and stores a concrete one, so comparing the two payloads directly would report
# changed on every run.
- name: Build the destination defaults
  vars:
    bookorbit_destinations_current: "{{ bookorbit_automation.json.destinations | default({}, true) }}"
  ansible.builtin.set_fact:
    bookorbit_destinations: >-
      {% set wanted = {} %}
      {% set unmatched = [] %}
      {% for medium, want in bookorbit_request_destinations.items() %}
      {%   set library = bookorbit_libraries.json | selectattr('name', 'equalto', want.library) | list | first %}
      {%   set folder = (library.folders | selectattr('path', 'equalto', want.folder) | list | first)
                        if want.folder is defined else none %}
      {%   set _ = wanted.update({medium: {'libraryId': library.id, 'folderId': folder.id if folder else none}}) %}
      {%   set current = bookorbit_destinations_current.get(medium, {}) %}
      {%   set folder_ok = (current.get('folderId') == folder.id) if folder
                           else (current.get('folderId') is not none) %}
      {%   if current.get('libraryId') != library.id or not folder_ok %}
      {%     set _ = unmatched.append(medium) %}
      {%   endif %}
      {% endfor %}
      {{ {'wanted': wanted, 'differs': unmatched | length > 0} | to_json }}
  when: bookorbit_request_destinations | length > 0

- name: Set the request destination defaults
  ansible.builtin.uri:
    url: "{{ bookorbit_api_url }}/admin/book-request-automation"
    method: PUT
    headers:
      Authorization: "Bearer {{ bookorbit_login.json.accessToken }}"
    body_format: json
    body:
      destinations: "{{ (bookorbit_destinations | from_json).wanted }}"
    status_code: [200, 201]
  when:
    - bookorbit_request_destinations | length > 0
    - (bookorbit_destinations | from_json).differs
  changed_when: true
  no_log: true
