- name: Copy docker-compose.yaml
  ansible.builtin.template:
    src: docker-compose.yaml
    dest: '{{ docker_compose_dir }}/bookorbit/docker-compose.yaml'
    mode: '0644'

- name: Copy .env file
  ansible.builtin.template:
    src: .env.j2
    dest: '{{ docker_compose_dir }}/bookorbit/.env'
    mode: '0600'

- name: Start
  community.docker.docker_compose_v2:
    project_src: '{{ docker_compose_dir }}/bookorbit'
    state: present
