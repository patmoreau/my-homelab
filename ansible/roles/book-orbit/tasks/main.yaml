- name: Create folder
  ansible.builtin.file:
    path: '{{ docker_compose_dir }}/bookorbit'
    state: directory
    mode: '0755'

- name: Create data directories
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: '{{ nas_puid }}'
    group: '{{ nas_pgid }}'
    mode: '0777'
  loop:
    - /data/bookorbit
    - /data/bookorbit/postgres

- name: Copy docker-compose.yaml
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: '{{ docker_compose_dir }}/bookorbit/docker-compose.yaml'
    mode: '0644'

- name: Copy .env file
  ansible.builtin.template:
    src: .env.j2
    dest: '{{ docker_compose_dir }}/bookorbit/.env'
    mode: '0600'

- name: Start
  community.docker.docker_compose_v2:
    project_src: '{{ docker_compose_dir }}/bookorbit'
    state: present
