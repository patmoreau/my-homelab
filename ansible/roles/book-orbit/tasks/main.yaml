- name: Create folder
  ansible.builtin.file:
    path: '{{ docker_compose_dir }}/bookorbit'
    state: directory
    mode: '0755'

- name: Create data directories
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: '{{ nas_puid }}'
    group: '{{ nas_pgid }}'
    mode: '0777'
  loop:
    - /data/bookorbit
    - /data/bookorbit/postgres
    - /data/bookorbit/data

- name: Deploy via Docker Compose
  ansible.builtin.include_tasks: docker.yaml
  when: container_runtime == 'docker'

- name: Deploy via Podman Quadlet
  ansible.builtin.include_tasks: podman.yaml
  when: container_runtime == 'podman'
