- name: Copy deployment files
  ansible.builtin.template:
    src: '{{ item.src }}'
    dest: '{{ docker_compose_dir }}/essere/{{ item.dest }}'
    mode: '{{ item.mode }}'
  loop:
    - {src: 'docker-compose.yaml', dest: 'docker-compose.yaml', mode: '0644'}
    - {src: '.env.j2', dest: '.env', mode: '0600'}

- name: Start containers
  community.docker.docker_compose_v2:
    project_src: '{{ docker_compose_dir }}/essere'
    state: present
    # Forces recreation if the image was updated
    pull: never
