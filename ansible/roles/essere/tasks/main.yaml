- name: Create project folder
  ansible.builtin.file:
    path: '{{ docker_compose_dir }}/essere'
    state: directory
    mode: '0755'

- name: Create data directories
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    # Using 777 can be risky, but ensures Docker volume access in LXC
    # if user mapping isn't perfectly aligned.
    mode: '0777'
  loop:
    - /data/postgres
    - /data/directus_uploads

- name: Log in to GHCR so auto-update can pull the private image
  ansible.builtin.command:
    cmd: >-
      podman login ghcr.io -u {{ essere_ghcr_username }}
      --password-stdin --authfile /root/.config/containers/auth.json
    stdin: '{{ essere_ghcr_pat }}'
  changed_when: false
  no_log: true

- name: Deploy via Podman Quadlet
  ansible.builtin.include_tasks: podman.yaml
