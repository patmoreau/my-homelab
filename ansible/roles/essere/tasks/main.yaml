- name: Create project folder
  ansible.builtin.file:
    path: '{{ docker_compose_dir }}/essere'
    state: directory
    mode: '0755'

- name: Create data directories
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    # Using 777 can be risky, but ensures Docker volume access in LXC
    # if user mapping isn't perfectly aligned.
    mode: '0777'
  loop:
    - /data/postgres
    - /data/directus_uploads

- name: Export image to tarball locally
  delegate_to: localhost
  # Become: false ensures it runs as your local user who has the podman socket access.
  become: false
  ansible.builtin.shell: |
    set -o pipefail
    podman save {{ image_name }}:{{ image_tag }} -o {{ tmp_archive }}
  args:
    executable: /bin/bash
  # Check if image exists before saving to avoid crashes
  changed_when: true

- name: Transfer image archive to LXC
  ansible.builtin.copy:
    src: '{{ tmp_archive }}'
    dest: '{{ tmp_archive }}'
    mode: '0644'

- name: Load image on the LXC
  ansible.builtin.shell: |
    set -o pipefail
    podman load -i {{ tmp_archive }}
  args:
    executable: /bin/bash
  register: essere_docker_load_result
  changed_when: "'Loaded image' in essere_docker_load_result.stdout"

- name: Clean up archives
  block:
    - name: Remove remote archive
      ansible.builtin.file:
        path: '{{ tmp_archive }}'
        state: absent
    - name: Remove local archive
      delegate_to: localhost
      become: false
      ansible.builtin.file:
        path: '{{ tmp_archive }}'
        state: absent

- name: Deploy via Podman Quadlet
  ansible.builtin.include_tasks: podman.yaml
