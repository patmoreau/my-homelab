- name: Ensure Quadlet directory exists
  ansible.builtin.file:
    path: /etc/containers/systemd
    state: directory
    mode: "0755"

- name: Create essere env file
  ansible.builtin.template:
    src: essere.env.j2
    dest: "{{ docker_compose_dir }}/essere/essere.env"
    mode: "0600"
  register: essere_env

- name: Deploy essere Quadlet units
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/etc/containers/systemd/{{ item }}"
    mode: "0644"
  loop:
    - essere-db.container
    - essere-directus.container
    - essere-app.container
  register: essere_quadlet

- name: Start essere services in order
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: "{{ 'restarted' if (essere_quadlet.changed or essere_env.changed or (essere_docker_load_result.changed | default(false))) else 'started' }}"
    daemon_reload: true
  loop:
    - essere-db.service
    - essere-directus.service
    - essere-app.service
