- name: Install runner dependencies
  ansible.builtin.apt:
    name:
      - curl
      - tar
      - jq
      - libicu-dev
    state: present
    update_cache: true

- name: Create runner user
  ansible.builtin.user:
    name: "{{ github_runner_user }}"
    home: "{{ github_runner_dir }}"
    shell: /bin/bash
    system: true
    create_home: true

- name: Grant the runner access to run podman
  ansible.builtin.include_tasks: podman-socket.yaml

- name: Download GitHub Actions runner
  ansible.builtin.get_url:
    url: "https://github.com/actions/runner/releases/download/v{{ github_runner_version }}/actions-runner-linux-x64-{{ github_runner_version }}.tar.gz"
    dest: "/tmp/actions-runner-{{ github_runner_version }}.tar.gz"
    mode: "0644"

- name: Check whether the runner is already configured
  ansible.builtin.stat:
    path: "{{ github_runner_dir }}/.runner"
  register: runner_config

- name: Unarchive runner
  ansible.builtin.unarchive:
    src: "/tmp/actions-runner-{{ github_runner_version }}.tar.gz"
    dest: "{{ github_runner_dir }}"
    remote_src: true
    owner: "{{ github_runner_user }}"
    group: "{{ github_runner_user }}"
    creates: "{{ github_runner_dir }}/config.sh"

- name: Request a runner registration token
  ansible.builtin.uri:
    url: "https://api.github.com/repos/{{ github_runner_owner }}/{{ github_runner_repo }}/actions/runners/registration-token"
    method: POST
    headers:
      Authorization: "Bearer {{ vault_github_runner_pat }}"
      Accept: "application/vnd.github+json"
      X-GitHub-Api-Version: "2022-11-28"
    status_code: 201
  register: runner_token
  when: not runner_config.stat.exists
  no_log: true

- name: Configure the runner
  become: true
  become_user: "{{ github_runner_user }}"
  ansible.builtin.command:
    cmd: >-
      ./config.sh --unattended --replace
      --url https://github.com/{{ github_runner_owner }}/{{ github_runner_repo }}
      --token {{ runner_token.json.token }}
      --name {{ github_runner_name }}
      --labels {{ github_runner_labels }}
    chdir: "{{ github_runner_dir }}"
  when: not runner_config.stat.exists
  changed_when: false
  no_log: true

- name: Install the runner systemd service
  ansible.builtin.command:
    cmd: "./svc.sh install {{ github_runner_user }}"
    chdir: "{{ github_runner_dir }}"
    creates: "/etc/systemd/system/actions.runner.{{ github_runner_owner }}-{{ github_runner_repo }}.{{ github_runner_name }}.service"

- name: Ensure the runner service is started and enabled
  ansible.builtin.systemd_service:
    name: "actions.runner.{{ github_runner_owner }}-{{ github_runner_repo }}.{{ github_runner_name }}.service"
    state: started
    enabled: true
