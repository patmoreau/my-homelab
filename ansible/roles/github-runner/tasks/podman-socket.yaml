# Podman deploy path for the runner. The holefeeder CI deploys via `sudo podman
# auto-update` (which can't use the remote socket), so the runner only needs sudo to run
# podman as root. Everything the earlier `podman compose` approach needed — a socket group,
# a compose provider, the runner .env, a docker-config — is obsolete and removed below.
- name: Allow the runner to run podman as root
  ansible.builtin.copy:
    dest: /etc/sudoers.d/actions-runner-podman
    content: "{{ github_runner_user }} ALL=(root) NOPASSWD: /usr/bin/podman\n"
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s

# Removing the SocketGroup override file is enough — the running socket keeps its (harmless)
# root:podman group until the next reboot, when it comes back up as root:root. Deliberately
# NOT restarting podman.socket here: that recreates the socket file and breaks the bind-mount
# in every socket-consuming container (promtail, cadvisor).
- name: Remove obsolete podman-compose deploy artifacts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ github_runner_dir }}/.env"
    - /usr/local/lib/podman/docker-compose
    - /etc/containers/containers.conf.d/50-compose.conf
    - /etc/systemd/system/podman.socket.d/override.conf
