- name: Create directory
  ansible.builtin.file:
    path: "{{ docker_compose_dir }}/grafana"
    state: directory
    mode: "0755"

- name: Create volume folders
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0777"
  loop:
    - /data/grafana

- name: Create config directories
  ansible.builtin.file:
    path: "{{ docker_compose_dir }}/grafana/config/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - datasources
    - dashboards
    - dashboard_files

- name: Copy datasources.yml
  ansible.builtin.template:
    src: datasources.yml.j2
    dest: "{{ docker_compose_dir }}/grafana/config/datasources/datasources.yml"
    mode: "0644"

- name: Copy dashboards.yml
  ansible.builtin.template:
    src: dashboards.yml.j2
    dest: "{{ docker_compose_dir }}/grafana/config/dashboards/dashboards.yml"
    mode: "0644"

- name: Copy dashboard files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ docker_compose_dir }}/grafana/config/dashboard_files/{{ item }}"
    mode: "0644"
  loop:
    - node-exporter-full.json
    - proxmox-cluster.json
    - homelab-services.json

- name: Copy docker-compose.yaml
  ansible.builtin.template:
    src: docker-compose.yaml
    dest: "{{ docker_compose_dir }}/grafana/docker-compose.yaml"
    mode: "0644"

- name: Create .env file
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ docker_compose_dir }}/grafana/.env"
    mode: "0600"

- name: Start
  community.docker.docker_compose_v2:
    project_src: "{{ docker_compose_dir }}/grafana"
    state: present
