- name: Create directory
  ansible.builtin.file:
    path: '{{ docker_compose_dir }}/homeassistant'
    state: directory
    mode: '0755'

- name: Deploy via Docker Compose
  ansible.builtin.include_tasks: docker.yaml
  when: container_runtime == 'docker'

- name: Deploy via Podman Quadlet
  ansible.builtin.include_tasks: podman.yaml
  when: container_runtime == 'podman'

- name: Wait for configuration.yaml to be generated
  ansible.builtin.wait_for:
    path: /data/config/configuration.yaml
    state: present
    timeout: 60

- name: Install HACS via installation script in the container
  ansible.builtin.command: "{{ container_runtime }} exec homeassistant bash -c \"wget -O - https://get.hacs.xyz | bash -\""
  args:
    creates: /data/config/custom_components/hacs
  register: homeassistant_hacs_install

- name: Configure trusted proxies
  ansible.builtin.blockinfile:
    path: /data/config/configuration.yaml
    marker: '# {mark} ANSIBLE MANAGED BLOCK - TRAEFIK'
    block: |
      http:
        use_x_forwarded_for: true
        trusted_proxies:
          - {{ hostvars['lxc-gateway']['ansible_host'] }}
  register: homeassistant_config

- name: Configure system log event firing
  ansible.builtin.blockinfile:
    path: /data/config/configuration.yaml
    marker: '# {mark} ANSIBLE MANAGED BLOCK - SYSTEM LOG'
    block: |
      system_log:
        fire_event: true
  register: homeassistant_system_log_config

- name: Set whether Home Assistant needs a restart
  ansible.builtin.set_fact:
    homeassistant_restart: >-
      {{ homeassistant_config.changed or homeassistant_hacs_install.changed
         or homeassistant_system_log_config.changed }}

- name: Restart Home Assistant to apply config (Docker)
  community.docker.docker_compose_v2:
    project_src: '{{ docker_compose_dir }}/homeassistant'
    state: restarted
  when: container_runtime == 'docker' and homeassistant_restart | bool

- name: Restart Home Assistant to apply config (Podman)
  ansible.builtin.systemd:
    name: homeassistant.service
    state: restarted
  when: container_runtime == 'podman' and homeassistant_restart | bool
