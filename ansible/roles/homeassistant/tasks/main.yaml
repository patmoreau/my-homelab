- name: Create directory
  ansible.builtin.file:
    path: '{{ docker_compose_dir }}/homeassistant'
    state: directory
    mode: '0755'

- name: Deploy via Podman Quadlet
  ansible.builtin.include_tasks: podman.yaml

- name: Wait for configuration.yaml to be generated
  ansible.builtin.wait_for:
    path: /data/config/configuration.yaml
    state: present
    timeout: 60

- name: Install HACS via installation script in the container
  ansible.builtin.command: "podman exec homeassistant bash -c \"wget -O - https://get.hacs.xyz | bash -\""
  args:
    creates: /data/config/custom_components/hacs
  register: homeassistant_hacs_install

- name: Configure trusted proxies
  ansible.builtin.blockinfile:
    path: /data/config/configuration.yaml
    marker: '# {mark} ANSIBLE MANAGED BLOCK - TRAEFIK'
    block: |
      http:
        use_x_forwarded_for: true
        trusted_proxies:
          - {{ hostvars['lxc-gateway']['ansible_host'] }}
  register: homeassistant_config

- name: Configure system log event firing
  ansible.builtin.blockinfile:
    path: /data/config/configuration.yaml
    marker: '# {mark} ANSIBLE MANAGED BLOCK - SYSTEM LOG'
    block: |
      system_log:
        fire_event: true
  register: homeassistant_system_log_config

# The UI writes to automations.yaml, so Ansible-managed automations live in
# their own directory under a second `automation` key. Editing automations.yaml
# here would fight the UI editor.
- name: Configure Ansible-managed automations directory
  ansible.builtin.blockinfile:
    path: /data/config/configuration.yaml
    marker: '# {mark} ANSIBLE MANAGED BLOCK - AUTOMATIONS'
    block: |
      automation ansible: !include_dir_merge_list automations_ansible/
  register: homeassistant_automations_config

- name: Create Ansible-managed automations directory
  ansible.builtin.file:
    path: /data/config/automations_ansible
    state: directory
    mode: '0755'

- name: Deploy Grafana alert automation
  ansible.builtin.template:
    src: grafana-alerts.yaml.j2
    dest: /data/config/automations_ansible/grafana-alerts.yaml
    mode: '0644'
  register: homeassistant_grafana_alerts

- name: Set whether Home Assistant needs a restart
  ansible.builtin.set_fact:
    homeassistant_restart: >-
      {{ homeassistant_config.changed or homeassistant_hacs_install.changed
         or homeassistant_system_log_config.changed
         or homeassistant_automations_config.changed
         or homeassistant_grafana_alerts.changed }}

- name: Restart Home Assistant to apply config
  ansible.builtin.systemd:
    name: homeassistant.service
    state: restarted
  when: homeassistant_restart | bool
