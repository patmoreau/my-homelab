- name: Ensure Quadlet directory exists
  ansible.builtin.file:
    path: /etc/containers/systemd
    state: directory
    mode: "0755"

- name: Create custom-cont-init.d directory
  ansible.builtin.file:
    path: "{{ docker_compose_dir }}/homeassistant/custom-cont-init.d"
    state: directory
    mode: "0755"

- name: Install cffi-consistency init script
  ansible.builtin.copy:
    src: 10-fix-cffi
    dest: "{{ docker_compose_dir }}/homeassistant/custom-cont-init.d/10-fix-cffi"
    mode: "0755"
  register: homeassistant_cont_init

- name: Create homeassistant env file
  ansible.builtin.template:
    src: homeassistant.env.j2
    dest: "{{ docker_compose_dir }}/homeassistant/homeassistant.env"
    mode: "0600"
  register: homeassistant_env

- name: Deploy homeassistant Quadlet unit
  ansible.builtin.template:
    src: homeassistant.container
    dest: /etc/containers/systemd/homeassistant.container
    mode: "0644"
  register: homeassistant_quadlet

- name: Start homeassistant
  ansible.builtin.systemd:
    name: homeassistant.service
    state: "{{ 'restarted' if (homeassistant_quadlet.changed or homeassistant_env.changed or homeassistant_cont_init.changed) else 'started' }}"
    daemon_reload: true

# Matter Hub keeps its paired fabrics under /data, so the Matter pairings survive
# the Quadlet's fresh --rm container.
- name: Create Matter Hub data directory
  ansible.builtin.file:
    path: /data/matter-hub
    state: directory
    mode: "0755"

- name: Create Matter Hub env file
  ansible.builtin.template:
    src: matter-hub.env.j2
    dest: "{{ docker_compose_dir }}/homeassistant/matter-hub.env"
    mode: "0600"
  register: matter_hub_env

- name: Deploy Matter Hub Quadlet unit
  ansible.builtin.template:
    src: homeassistant-matter-hub.container
    dest: /etc/containers/systemd/homeassistant-matter-hub.container
    mode: "0644"
  register: matter_hub_quadlet

- name: Start Matter Hub
  ansible.builtin.systemd:
    name: homeassistant-matter-hub.service
    state: "{{ 'restarted' if (matter_hub_quadlet.changed or matter_hub_env.changed) else 'started' }}"
    daemon_reload: true
