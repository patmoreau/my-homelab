- Media:
    - Jellyfin:
        icon: jellyfin.png
        href: http://jellyfin.homelab.lan
        description: Movies & TV Shows
        widget:
          type: jellyfin
          url: http://jellyfin.homelab.lan
          key: {{HOMEPAGE_VAR_JELLYFIN_API_KEY}}

    - Books:
        icon: calibre-web.png
        href: http://books.homelab.lan
        description: E-book Library
        widget:
          type: calibreweb
          url: http://books.homelab.lan
          username: {{HOMEPAGE_VAR_CALIBREWEB_USERNAME}}
          password: {{HOMEPAGE_VAR_CALIBREWEB_PASSWORD}}

    - Transmission:
        icon: transmission.png
        href: http://transmission.homelab.lan
        description: Torrent Client
        widget:
          type: transmission
          url: http://transmission.homelab.lan
          rpcUrl: /transmission/
          username: {{HOMEPAGE_VAR_TRANSMISSION_USERNAME}}
          password: {{HOMEPAGE_VAR_TRANSMISSION_PASSWORD}}

    - Filebrowser:
        icon: filebrowser.png
        href: http://filebrowser.homelab.lan
        description: File Browser
        widget:
          type: filebrowser
          url: http://filebrowser.homelab.lan
          username: {{HOMEPAGE_VAR_FILEBROWSER_USERNAME}}
          password: {{HOMEPAGE_VAR_FILEBROWSER_PASSWORD}}
          # authHeader: X-My-Header # If using Proxy header authentication

- Docker:
    - Qnap Watcher:
        icon: qnap.png
        href: https://qnap.homelab.lan
        widget:
          type: customapi
          url: http://service-watcher.homelab.lan/api/qnap
          mappings:
            - field: Status
              label: Status
            - field: LastCheck
              label: Last Check
            - field: Progress
              label: Progress
            - field: FinishIn
              label: Finish In

- Infrastructure:
    - Proxmox:
        icon: proxmox.png
        href: https://proxmox.homelab.lan:8006
        description: Virtual Machine Manager
        widget:
          type: proxmox
          url: https://proxmox.homelab.lan:8006
          username: {{HOMEPAGE_VAR_PROXMOX_USERNAME}}
          password: {{HOMEPAGE_VAR_PROXMOX_PASSWORD}}
          node: homelab

    - Traefik:
        icon: traefik.png
        href: http://gateway.homelab.lan
        description: Reverse Proxy
        widget:
          type: traefik
          url: http://gateway.homelab.lan

    - Qnap:
        icon: qnap.png
        href: https://qnap.homelab.lan
        ping: qnap.homelab.lan
        description: NAS Management
        widget:
          type: qnap
          url: https://qnap.homelab.lan:443
          username: {{HOMEPAGE_VAR_QNAP_USERNAME}}
          password: {{HOMEPAGE_VAR_QNAP_PASSWORD}}
          volume: DataVol1
          fields: ['cpuUsage', 'memUsage', 'systemTempC', 'volumeUsage']

- Self-Hosted:
    - Immich:
        icon: immich.png
        href: http://immich.homelab.lan
        description: Photo & Video Backup
        widget:
          type: immich
          url: http://immich.homelab.lan
          key: {{HOMEPAGE_VAR_IMMICH_API_KEY}}
          fields: ['photos', 'videos', 'storage']
          version: 2

- Observability:
    - Grafana:
        icon: grafana.png
        href: http://grafana.homelab.lan
        description: Metrics Dashboard
        widget:
          type: grafana
          version: 2
          url: http://grafana.homelab.lan
          username: {{HOMEPAGE_VAR_GRAFANA_ADMIN_USER}}
          password: {{HOMEPAGE_VAR_GRAFANA_ADMIN_PASSWORD}}

    - Prometheus:
        icon: prometheus.png
        href: http://prometheus.homelab.lan
        description: Metrics Server
        widget:
          type: prometheus
          url: http://prometheus.homelab.lan

- Security & Network:
    - Vaultwarden:
        icon: vaultwarden.png
        href: http://vaultwarden.homelab.lan
        ping: vaultwarden.homelab.lan
        description: Password Manager

    - Cloudflare:
        icon: cloudflare.png
        href: https://dash.cloudflare.com
        widget:
          type: cloudflared
          accountid: {{HOMEPAGE_VAR_CLOUDFLARE_ACCOUNT_ID}}
          tunnelid: {{HOMEPAGE_VAR_CLOUDFLARE_TUNNEL_ID}}
          key: {{HOMEPAGE_VAR_CLOUDFLARE_API_KEY}}
