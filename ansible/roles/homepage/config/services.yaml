# Grafana panels embedded as iframes. Source dashboard: "Proxmox via Prometheus"
# (uid Dp7Cd57Zza, ansible/roles/grafana/files/proxmox-cluster.json).
# var-instance is the pve job's instance label = the Proxmox host address.
# Needs GF_SECURITY_ALLOW_EMBEDDING=true on Grafana.
- Host Metrics:
    - 'CPU':
        widget:
          type: iframe
          src: https://grafana.moreaulab.ca/d-solo/Dp7Cd57Zza/proxmox-via-prometheus?orgId=1&panelId=23&var-instance=192.168.8.10&from=now-6h&to=now&theme=dark&refresh=1m
          classes: h-60
          referrerPolicy: same-origin
          allowScrolling: 'no'

    - 'Memory':
        widget:
          type: iframe
          src: https://grafana.moreaulab.ca/d-solo/Dp7Cd57Zza/proxmox-via-prometheus?orgId=1&panelId=24&var-instance=192.168.8.10&from=now-6h&to=now&theme=dark&refresh=1m
          classes: h-60
          referrerPolicy: same-origin
          allowScrolling: 'no'

    - 'Network IO':
        widget:
          type: iframe
          src: https://grafana.moreaulab.ca/d-solo/Dp7Cd57Zza/proxmox-via-prometheus?orgId=1&panelId=13&var-instance=192.168.8.10&from=now-6h&to=now&theme=dark&refresh=1m
          classes: h-60
          referrerPolicy: same-origin
          allowScrolling: 'no'

    - 'Disk IO':
        widget:
          type: iframe
          src: https://grafana.moreaulab.ca/d-solo/Dp7Cd57Zza/proxmox-via-prometheus?orgId=1&panelId=12&var-instance=192.168.8.10&from=now-6h&to=now&theme=dark&refresh=1m
          classes: h-60
          referrerPolicy: same-origin
          allowScrolling: 'no'

- Media:
    - Jellyfin:
        icon: jellyfin.png
        href: https://jellyfin.moreaulab.ca
        siteMonitor: https://jellyfin.moreaulab.ca
        description: Movies & TV Shows
        proxmoxNode: homelab
        proxmoxVMID: 111
        proxmoxType: lxc
        widget:
          type: jellyfin
          url: https://jellyfin.moreaulab.ca
          key: {{HOMEPAGE_VAR_JELLYFIN_API_KEY}}
          # Jellyfin 12 dropped the legacy /emby route prefix (404) and stopped
          # accepting the key as an api_key query param or X-Emby-Token (401).
          # version 2 makes the widget call the unprefixed endpoints with an
          # Authorization: MediaBrowser Token="..." header instead.
          version: 2

    - Immich:
        icon: immich.png
        href: https://immich.moreaulab.ca
        siteMonitor: https://immich.moreaulab.ca
        description: Photo & Video Backup
        proxmoxNode: homelab
        proxmoxVMID: 116
        proxmoxType: lxc
        widget:
          type: immich
          url: https://immich.moreaulab.ca
          key: {{HOMEPAGE_VAR_IMMICH_API_KEY}}
          fields: ['photos', 'videos', 'storage']
          version: 2

    - Book Orbit:
        icon: sh-bookorbit.png
        href: https://books.moreaulab.ca
        siteMonitor: https://books.moreaulab.ca
        description: Book Manager
        proxmoxNode: homelab
        proxmoxVMID: 111
        proxmoxType: lxc

    - Transmission:
        icon: transmission.png
        href: https://transmission.moreaulab.ca
        siteMonitor: https://transmission.moreaulab.ca
        description: Torrent Client
        proxmoxNode: homelab
        proxmoxVMID: 111
        proxmoxType: lxc
        widget:
          type: transmission
          url: https://transmission.moreaulab.ca
          rpcUrl: /transmission/
          username: {{HOMEPAGE_VAR_TRANSMISSION_USERNAME}}
          password: {{HOMEPAGE_VAR_TRANSMISSION_PASSWORD}}

    - Filestash:
        icon: filestash.png
        href: https://docs.moreaulab.ca
        siteMonitor: https://docs.moreaulab.ca
        description: File Browser
        proxmoxNode: homelab
        proxmoxVMID: 111
        proxmoxType: lxc
        # No homepage widget exists for Filestash, so this tile is a plain link.

- Infrastructure:
    - PVE:
        icon: proxmox.png
        href: https://pve.moreaulab.ca
        siteMonitor: https://pve.moreaulab.ca
        description: Virtual Machine Manager
        widget:
          type: proxmox
          url: https://pve.moreaulab.ca
          username: {{HOMEPAGE_VAR_PROXMOX_USERNAME}}
          password: {{HOMEPAGE_VAR_PROXMOX_PASSWORD}}
          node: homelab

    - PBS:
        icon: proxmox-backup-server.png
        href: https://pbs.moreaulab.ca
        siteMonitor: https://pbs.moreaulab.ca
        description: Backup Server
        proxmoxNode: homelab
        proxmoxVMID: 118
        proxmoxType: lxc
        widget:
          type: proxmoxbackupserver
          url: https://pbs.moreaulab.ca
          username: {{HOMEPAGE_VAR_PBS_TOKEN_ID}}
          password: {{HOMEPAGE_VAR_PBS_TOKEN_SECRET}}
          fields: ['datastore_usage', 'failed_tasks_24h', 'cpu_usage', 'memory_usage']

    - Router:
        icon: openwrt.png
        href: https://router.moreaulab.ca
        siteMonitor: https://router.moreaulab.ca
        description: GL.iNet Flint 2
        widget:
          type: openwrt
          url: https://192.168.8.1:8443
          username: {{HOMEPAGE_VAR_ROUTER_USERNAME}}
          password: {{HOMEPAGE_VAR_ROUTER_PASSWORD}}
          interfaceName: eth1

    - Traefik:
        icon: traefik.png
        href: https://gateway.moreaulab.ca
        siteMonitor: https://gateway.moreaulab.ca
        description: Reverse Proxy
        proxmoxNode: homelab
        proxmoxVMID: 110
        proxmoxType: lxc
        widget:
          type: traefik
          url: https://gateway.moreaulab.ca

    - NAS:
        icon: qnap.png
        href: https://nas.moreaulab.ca
        siteMonitor: https://nas.moreaulab.ca
        description: NAS Management
        widget:
          type: qnap
          url: https://nas.moreaulab.ca:443
          username: {{HOMEPAGE_VAR_QNAP_USERNAME}}
          password: {{HOMEPAGE_VAR_QNAP_PASSWORD}}
          volume: DataVol1
          fields: ['cpuUsage', 'memUsage', 'systemTempC', 'volumeUsage']

    - NAS Watcher:
        icon: qnap.png
        href: https://nas.moreaulab.ca
        siteMonitor: https://service-watcher.moreaulab.ca/api/qnap
        description: NAS RAID Status
        proxmoxNode: homelab
        proxmoxVMID: 111
        proxmoxType: lxc
        widget:
          type: customapi
          url: https://service-watcher.moreaulab.ca/api/qnap
          mappings:
            - field: Status
              label: Status
            - field: LastCheck
              label: Last Check
            - field: Progress
              label: Progress
            - field: FinishIn
              label: Finish In


- Observability:
    - Grafana:
        icon: grafana.png
        href: https://grafana.moreaulab.ca
        siteMonitor: https://grafana.moreaulab.ca
        description: Metrics Dashboard
        proxmoxNode: homelab
        proxmoxVMID: 113
        proxmoxType: lxc
        widget:
          type: grafana
          version: 2
          url: https://grafana.moreaulab.ca
          username: {{HOMEPAGE_VAR_GRAFANA_ADMIN_USER}}
          password: {{HOMEPAGE_VAR_GRAFANA_ADMIN_PASSWORD}}

    - Prometheus:
        icon: prometheus.png
        href: https://prometheus.moreaulab.ca
        siteMonitor: https://prometheus.moreaulab.ca
        description: Metrics Server
        proxmoxNode: homelab
        proxmoxVMID: 113
        proxmoxType: lxc
        widget:
          type: prometheus
          url: https://prometheus.moreaulab.ca
          fields: ['targets_up', 'targets_down', 'alerts_total']

    - Umami:
        icon: umami.png
        href: https://analytics.moreaulab.ca
        siteMonitor: https://analytics.moreaulab.ca
        description: essere.ca Analytics
        proxmoxNode: homelab
        proxmoxVMID: 112
        proxmoxType: lxc

- Security & Network:
    - Vaultwarden:
        icon: vaultwarden.png
        href: https://vault.moreaulab.ca
        siteMonitor: https://vault.moreaulab.ca
        description: Password Manager
        proxmoxNode: homelab
        proxmoxVMID: 115
        proxmoxType: lxc

    - Cloudflare:
        icon: cloudflare.png
        href: https://dash.cloudflare.com
        widget:
          type: cloudflared
          accountid: {{HOMEPAGE_VAR_CLOUDFLARE_ACCOUNT_ID}}
          tunnelid: {{HOMEPAGE_VAR_CLOUDFLARE_TUNNEL_ID}}
          key: {{HOMEPAGE_VAR_CLOUDFLARE_API_KEY}}

    - Tailscale:
        icon: tailscale.png
        href: https://tailscale.com
        description: VPN Client
        widget:
          type: tailscale
          deviceid: {{HOMEPAGE_VAR_TAILSCALE_DEVICE_ID}}
          key: {{HOMEPAGE_VAR_TAILSCALE_API_KEY}}
          custom:
            - state: tailscale_metrics.tailscale_byte_received
            - state: tailscale_metrics.tailscale_byte_sent

- Smart Home:
    - Home Assistant:
        icon: sh-home-assistant.png
        href: https://ha.moreaulab.ca
        siteMonitor: https://ha.moreaulab.ca
        proxmoxNode: homelab
        proxmoxVMID: 117
        proxmoxType: lxc
        widget:
          type: homeassistant
          url: https://ha.moreaulab.ca
          key: {{HOMEPAGE_VAR_HOMEASSISTANT_API_KEY}}
          custom:
            - state: sensor.thermostat_temperature
              label: indoor
              value: '{state}°C'
            - state: sensor.thermostat_humidite
              label: humidity
              value: '{state}%'
            - state: sensor.thermostat_outdoor_temperature
              label: outdoor
              value: '{state}°C'
            - template: "{{ states.switch|selectattr('state','equalto','on')|list|length }}"
              label: switches on

- Apps:
