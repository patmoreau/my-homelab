---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/settings/

title: 'MoreauLab'
subtitle: 'My Homelab Dashboard'
background:
  image: https://images.unsplash.com/photo-1502790671504-542ad42d5189?auto=format&fit=crop&w=2560&q=80
  blur: sm # sm, "", md, xl... see https://tailwindcss.com/docs/backdrop-blur
  saturate: 50 # 0, 50, 100... see https://tailwindcss.com/docs/backdrop-saturate
  brightness: 50 # 0, 50, 75... see https://tailwindcss.com/docs/backdrop-brightness
  opacity: 50 # 0-100

providers:
  openweathermap: openweathermapapikey
  weatherapi: weatherapiapikey

layout:
  # Two tabs. Groups are listed per tab in display order; every group and bookmark
  # group must carry a `tab:` — one without it renders on every tab.
  #
  # Daily — what gets opened on purpose.
  Media:
    style: row
    columns: 4
    tab: Daily
  Apps:
    style: row
    columns: 2
    tab: Daily
  Smart Home:
    style: row
    columns: 2
    tab: Daily
  Vault:
    style: row
    columns: 2
    tab: Daily
  AI:
    tab: Daily
  Finance:
    tab: Daily
  Productivity:
    tab: Daily
  Developer:
    tab: Daily
  Social:
    tab: Daily
  Entertainment:
    tab: Daily
  Books:
    tab: Daily
  Arg:
    tab: Daily

  # Monitoring — what gets opened when something is wrong. The six Grafana iframes
  # live here: they were the bulk of the clutter on the landing page.
  Host Metrics:
    style: row
    columns: 2
    tab: Monitoring
  Infrastructure:
    style: row
    columns: 4
    tab: Monitoring
  Observability:
    style: row
    columns: 4
    tab: Monitoring
  Network:
    style: row
    columns: 2
    tab: Monitoring

# Tiles in a row share a height instead of each sizing to its own content.
useEqualHeights: true
# Boxed header keeps the tab strip visually separate from the info widgets.
headerStyle: boxed
