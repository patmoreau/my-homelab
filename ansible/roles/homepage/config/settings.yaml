---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/settings/

title: 'MoreauLab'
subtitle: 'My Homelab Dashboard'
background:
  # First of the rotating space pool (role defaults `homepage_background_images`), which
  # is also what shows if custom.js never runs. The rotation itself is in custom.js —
  # this setting takes one still URL.
  image: /images/space/01-cosmic-cliffs.png
  # Tuned for the space pool, which starts far darker than the landscape photo it
  # replaced. `blur:` and `saturate:` are deliberately absent — an unset key adds no
  # backdrop class at all. blur-sm smeared the stars into mud, and saturate-50 drained
  # exactly the colour that makes a nebula worth looking at; together with
  # brightness-50 they left the page reading as plain black.
  # What remains is one stop of dimming for text contrast: brightness-75 on the
  # backdrop plus a 50% flat overlay. Checked against 01-cosmic-cliffs, the brightest
  # image in the pool, so the darker nebulae have headroom.
  brightness: 75 # 0, 50, 75... see https://tailwindcss.com/docs/backdrop-brightness
  opacity: 50 # 0-100

providers:
  openweathermap: openweathermapapikey
  weatherapi: weatherapiapikey

layout:
  # Two tabs. Groups are listed per tab in display order; every group and bookmark
  # group must carry a `tab:` — one without it renders on every tab.
  #
  # Daily — what gets opened on purpose.
  Media:
    style: row
    columns: 4
    tab: Daily
  Apps:
    style: row
    columns: 2
    tab: Daily
  Smart Home:
    style: row
    columns: 2
    tab: Daily
  Vault:
    style: row
    columns: 2
    tab: Daily
  AI:
    tab: Daily
  Finance:
    tab: Daily
  Productivity:
    tab: Daily
  Developer:
    tab: Daily
  Social:
    tab: Daily
  Entertainment:
    tab: Daily
  Books:
    tab: Daily
  Arg:
    tab: Daily

  # Monitoring — what gets opened when something is wrong. The six Grafana iframes
  # live here: they were the bulk of the clutter on the landing page.
  Host Metrics:
    style: row
    columns: 2
    tab: Monitoring
  Infrastructure:
    style: row
    columns: 4
    tab: Monitoring
  Observability:
    style: row
    columns: 4
    tab: Monitoring
  Network:
    style: row
    columns: 2
    tab: Monitoring

# Tiles in a row share a height instead of each sizing to its own content.
useEqualHeights: true
# Boxed header keeps the tab strip visually separate from the info widgets.
headerStyle: boxed
