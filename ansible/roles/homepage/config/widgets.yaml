---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/info-widgets/

- greeting:
    text_size: xl
    text: Welcome to MoreauLab

- openweathermap:
    label: Montréal
    latitude: 45.5017
    longitude: -73.5673
    units: metric
    provider: openweathermap
    apiKey: "{{HOMEPAGE_VAR_OPENWEATHERMAP_API_KEY}}"
    cache: 5

# The header `resources` widget was dropped: it duplicated the CPU/memory gauges now
# sitting at the top of the Monitoring tab.

- search:
    provider: google
    showSearchSuggestions: true
    target: _blank

- datetime:
    text_size: xl
    format:
      dateStyle: long
      timeStyle: short
      hourCycle: h23
