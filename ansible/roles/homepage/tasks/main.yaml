- name: Create directory
  ansible.builtin.file:
    path: "{{ docker_compose_dir }}/homepage"
    state: directory
    mode: "0755"

- name: Create config directory
  ansible.builtin.file:
    path: "{{ docker_compose_dir }}/homepage/config"
    state: directory
    mode: "0755"

- name: Create logs directory
  ansible.builtin.file:
    path: "{{ docker_compose_dir }}/homepage/config/logs"
    state: directory
    mode: "0755"

- name: Copy config files
  ansible.builtin.copy:
    src: config/
    dest: "{{ docker_compose_dir }}/homepage/config/"
    owner: "{{ nas_puid }}"
    group: "{{ nas_pgid }}"
    mode: "0644"
  register: homepage_config

# The space wallpaper pool used to be downloaded here; clear what earlier deploys left.
- name: Remove old background images
  ansible.builtin.file:
    path: "{{ docker_compose_dir }}/homepage/images"
    state: absent

# Rendered rather than copied with the rest of config/, so the status URL comes from the
# role defaults.
- name: Render custom.js
  ansible.builtin.template:
    src: custom.js.j2
    dest: "{{ docker_compose_dir }}/homepage/config/custom.js"
    owner: "{{ nas_puid }}"
    group: "{{ nas_pgid }}"
    mode: "0644"
  register: homepage_custom_js

- name: Deploy via Podman Quadlet
  ansible.builtin.include_tasks: podman.yaml
