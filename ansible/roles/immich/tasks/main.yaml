- name: Create directory
  ansible.builtin.file:
    path: '{{ docker_compose_dir }}/immich'
    state: directory
    mode: '0755'

- name: Create data directories
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    mode: '0777'
  loop:
    - /data/immich
    - /data/immich/postgres
    - /data/immich/model-cache

- name: Deploy via Docker Compose
  ansible.builtin.include_tasks: docker.yaml
  when: container_runtime == 'docker'

- name: Deploy via Podman Quadlet
  ansible.builtin.include_tasks: podman.yaml
  when: container_runtime == 'podman'

- name: Install immich-go
  ansible.builtin.get_url:
    url: 'https://github.com/simulot/immich-go/releases/download/{{ immich_go_version }}/immich-go_Linux_x86_64.tar.gz'
    dest: /tmp/immich-go.tar.gz
    mode: '0644'
  register: immich_go_download
  notify: Extract immich-go
