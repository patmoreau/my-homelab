- name: Create directory
  ansible.builtin.file:
    path: '{{ docker_compose_dir }}/jellyfin'
    state: directory
    mode: '0755'

- name: Create data directories
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: '{{ nas_puid }}'
    group: '{{ nas_pgid }}'
    mode: '0755'
  loop:
    - /data/jellyfin
    - '{{ docker_compose_dir }}/jellyfin/config/cache'
    - '{{ docker_compose_dir }}/jellyfin/config/log'
    - '{{ docker_compose_dir }}/jellyfin/config/transcodes'

# Jellyfin owns encoding.xml and rewrites it whenever the Playback settings are saved in
# the UI, so the file is patched in place rather than templated — everything not listed
# below keeps whatever the UI last set. The file only exists once Jellyfin has started at
# least once, hence the stat guard on a freshly built host.
- name: Check whether Jellyfin has written its encoding config
  ansible.builtin.stat:
    path: /data/jellyfin/encoding.xml
  register: jellyfin_encoding_xml

- name: Bound the HLS transcode scratch in encoding.xml
  ansible.builtin.replace:
    path: /data/jellyfin/encoding.xml
    regexp: "<{{ item.tag }}>[^<]*</{{ item.tag }}>"
    replace: "<{{ item.tag }}>{{ item.value }}</{{ item.tag }}>"
  loop:
    - tag: EnableThrottling
      value: "{{ jellyfin_enable_throttling | string | lower }}"
    - tag: ThrottleDelaySeconds
      value: "{{ jellyfin_throttle_delay_seconds }}"
    - tag: EnableSegmentDeletion
      value: "{{ jellyfin_enable_segment_deletion | string | lower }}"
    - tag: SegmentKeepSeconds
      value: "{{ jellyfin_segment_keep_seconds }}"
  loop_control:
    label: "{{ item.tag }}"
  when: jellyfin_encoding_xml.stat.exists
  register: jellyfin_encoding

# HardwareDecodingCodecs is a nested list, so it is swapped as a whole block rather than
# per-tag. Non-greedy and (?s) so the match stops at the first closing tag.
- name: Pin the hardware decoding codec list in encoding.xml
  vars:
    jellyfin_codec_block: "<HardwareDecodingCodecs>\n{{ jellyfin_hardware_decoding_codecs
      | map('regex_replace', '(.+)', '    <string>\\1</string>')
      | join('\n') }}\n  </HardwareDecodingCodecs>"
  ansible.builtin.replace:
    path: /data/jellyfin/encoding.xml
    regexp: '(?s)<HardwareDecodingCodecs>.*?</HardwareDecodingCodecs>'
    replace: "{{ jellyfin_codec_block }}"
  when: jellyfin_encoding_xml.stat.exists
  register: jellyfin_encoding_codecs

- name: Deploy via Podman Quadlet
  ansible.builtin.include_tasks: podman.yaml
