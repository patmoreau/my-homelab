- name: Create Loki data directory
  ansible.builtin.file:
    path: /data/loki
    state: directory
    mode: "0777"

- name: Ensure Quadlet directory exists
  ansible.builtin.file:
    path: /etc/containers/systemd
    state: directory
    mode: "0755"

- name: Deploy loki Quadlet unit
  ansible.builtin.template:
    src: loki.container
    dest: /etc/containers/systemd/loki.container
    mode: "0644"
  register: loki_quadlet

- name: Start loki
  ansible.builtin.systemd:
    name: loki.service
    state: "{{ 'restarted' if loki_quadlet.changed else 'started' }}"
    daemon_reload: true
