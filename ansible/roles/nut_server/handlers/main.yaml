---
# Handlers run in the order defined here (not notification order), so the
# driver instances are regenerated before upsd/upsmon restart.
- name: restart nut-driver-enumerator
  ansible.builtin.systemd:
    name: nut-driver-enumerator.service
    state: restarted

- name: restart nut-server
  ansible.builtin.systemd:
    name: nut-server.service
    state: restarted

- name: restart nut-monitor
  ansible.builtin.systemd:
    name: nut-monitor.service
    state: restarted
