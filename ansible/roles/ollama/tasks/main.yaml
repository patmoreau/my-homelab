- name: Ensure Ollama prerequisites are installed
  ansible.builtin.apt:
    name:
      - curl
      - zstd
      - mesa-utils
      - pciutils
    state: present
    update_cache: true

- name: Check if legacy Ollama Docker Compose exists
  ansible.builtin.stat:
    path: '{{ docker_compose_dir }}/ollama/docker-compose.yaml'
  register: ollama_legacy_compose

- name: Stop legacy Ollama Docker deployment
  community.docker.docker_compose_v2:
    project_src: '{{ docker_compose_dir }}/ollama'
    state: absent
  when: ollama_legacy_compose.stat.exists

- name: Get render group details
  ansible.builtin.getent:
    database: group
    key: render
    fail_key: false

- name: Validate existing render gid matches host mapping
  ansible.builtin.assert:
    that:
      - ansible_facts.getent_group.render is not defined or (ansible_facts.getent_group.render[1] | int) == ollama_render_gid
    fail_msg: >-
      Existing render gid ({{ ansible_facts.getent_group.render[1] }}) does not match ollama_render_gid ({{ ollama_render_gid }}).
      Update ollama_render_gid to the Proxmox host render gid used in Terraform idmap.

- name: Ensure render group exists with mapped gid
  ansible.builtin.group:
    name: render
    gid: '{{ ollama_render_gid }}'
    system: true
    state: present

- name: Install Ollama natively
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://ollama.com/install.sh | sh
  args:
    creates: /usr/local/bin/ollama
    executable: /bin/bash

- name: Ensure systemd override directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/ollama.service.d
    state: directory
    mode: '0755'

- name: Ensure Ollama log directory exists
  ansible.builtin.file:
    path: /var/log/ollama
    state: directory
    owner: ollama
    group: ollama
    mode: '0755'

- name: Configure Ollama ROCm override for Phoenix iGPU
  ansible.builtin.copy:
    dest: /etc/systemd/system/ollama.service.d/override.conf
    mode: '0644'
    content: |
      [Service]
      Environment="HSA_OVERRIDE_GFX_VERSION=11.0.1"
      Environment="ROCR_VISIBLE_DEVICES=0"
      Environment="OLLAMA_HOST=0.0.0.0"
      StandardOutput=append:/var/log/ollama/ollama.log
      StandardError=append:/var/log/ollama/ollama.log
  notify: Restart ollama

- name: Ensure ollama user is in render group
  ansible.builtin.user:
    name: ollama
    groups: render
    append: true
  notify: Restart ollama

- name: Ensure Ollama service is enabled and started
  ansible.builtin.systemd:
    name: ollama
    enabled: true
    state: started
    daemon_reload: true
