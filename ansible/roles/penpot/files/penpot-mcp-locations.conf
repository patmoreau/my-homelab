# Replaces the stock /etc/nginx/overrides/server.d/mcp-locations.conf in penpot-frontend.
# The stock file proxies to the hostname penpot-mcp, which nginx can only resolve through
# the resolver (not /etc/hosts), and the shared netns has no DNS. The MCP server sits in the
# same netns, so these point at loopback directly.
location /mcp/ws {
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_pass http://127.0.0.1:4402;
    proxy_http_version 1.1;
}

location /mcp/stream {
    proxy_pass http://127.0.0.1:4401/mcp$is_args$args;
    proxy_http_version 1.1;
}

location /mcp/sse {
    proxy_pass http://127.0.0.1:4401/sse$is_args$args;
    proxy_http_version 1.1;
}
