# Dumps the database and tars the assets into /data/penpot/backups, which the PBS job
# includes (the mount is backup = true). Seven days of local dumps on top of PBS.
- name: Deploy penpot backup script
  ansible.builtin.template:
    src: penpot-backup.sh.j2
    dest: "{{ docker_compose_dir }}/penpot/penpot-backup.sh"
    mode: "0750"

- name: Deploy penpot backup service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - penpot-backup.service
    - penpot-backup.timer

- name: Enable penpot backup timer
  ansible.builtin.systemd:
    name: penpot-backup.timer
    state: started
    enabled: true
    daemon_reload: true
