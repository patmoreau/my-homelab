- name: Create Prometheus data directory
  ansible.builtin.file:
    path: /data/prometheus
    state: directory
    mode: "0777"

- name: Ensure Quadlet directory exists
  ansible.builtin.file:
    path: /etc/containers/systemd
    state: directory
    mode: "0755"

- name: Deploy prometheus Quadlet unit
  ansible.builtin.template:
    src: prometheus.container
    dest: /etc/containers/systemd/prometheus.container
    mode: "0644"
  register: prometheus_quadlet

- name: Start prometheus
  ansible.builtin.systemd:
    name: prometheus.service
    state: "{{ 'restarted' if prometheus_quadlet.changed else 'started' }}"
    daemon_reload: true
