- name: Ensure Quadlet directory exists
  ansible.builtin.file:
    path: /etc/containers/systemd
    state: directory
    mode: "0755"

- name: Deploy promtail Quadlet unit
  ansible.builtin.template:
    src: promtail.container
    dest: /etc/containers/systemd/promtail.container
    mode: "0644"
  register: promtail_quadlet

- name: Start promtail
  ansible.builtin.systemd:
    name: promtail.service
    state: "{{ 'restarted' if promtail_quadlet.changed else 'started' }}"
    daemon_reload: true
