---
prowlarr_port: 9696

# Prowlarr's own API, reached on the LXC's published port from the host Ansible is on.
prowlarr_api_url: "http://127.0.0.1:{{ prowlarr_port }}/api/v1"

# The apps Prowlarr pushes its indexer list into. Each is addressed by hostname, not by
# IP: Radarr and Sonarr both filter on AllowedHosts and 400 a bare-IP Host header. Each
# container carries an --add-host mapping the other names to their pinned bridge address
# (see the .container units) — the router will not resolve a moreaulab.ca name to a
# private address, and this keeps the traffic off Traefik anyway. Categories are each
# app's own defaults: 2000-range for films, 5000-range for series.
prowlarr_self_url: "http://prowlarr.moreaulab.ca:{{ prowlarr_port }}"

prowlarr_applications:
  - name: Radarr
    implementation: Radarr
    config_contract: RadarrSettings
    base_url: "http://radarr.moreaulab.ca:7878"
    api_key: "{{ vault_radarr_api_key }}"
    sync_categories: [2000, 2010, 2020, 2030, 2040, 2045, 2050, 2060, 2070, 2080, 2090]
  - name: Sonarr
    implementation: Sonarr
    config_contract: SonarrSettings
    base_url: "http://sonarr.moreaulab.ca:8989"
    api_key: "{{ vault_sonarr_api_key }}"
    sync_categories: [5000, 5010, 5020, 5030, 5040, 5045, 5050, 5090]

# Newznab/Torznab categories Prowlarr syncs to Radarr — Radarr's own movie defaults.
prowlarr_radarr_sync_categories: [2000, 2010, 2020, 2030, 2040, 2045, 2050, 2060, 2070, 2080, 2090]

# Host header allowlist (Prowlarr's DNS-rebinding guard). Anything not listed gets
# 400 "Invalid Hostname". Three callers have to be covered: the browser and the homepage
# widget arrive through Traefik as *.moreaulab.ca, the Radarr/Prowlarr app link uses the
# same names (see the --add-host in the .container units), and Prometheus's blackbox job
# probes the LXC's LAN address. Loopback is always exempt, so the role's own API calls
# need no entry. Left unset, Prowlarr accepts any Host and logs a warning for it.
prowlarr_allowed_hosts: "*.moreaulab.ca,{{ ansible_host }}"

# Indexers Prowlarr enables, by the exact name its definition catalog uses (Prowlarr ships
# ~630 definitions; enabling one is what creates an indexer). These four are public, need
# no account, and work without FlareSolverr — 1337x and friends sit behind Cloudflare and
# would need that extra service before their Test passes. Prowlarr pushes whatever is
# enabled here into Radarr on its own, through the fullSync app link above.
prowlarr_indexers:
  - YTS
  - The Pirate Bay
  - TorrentDownload
  - Knaben

# "Standard" — the app profile every fresh Prowlarr creates, and the only one here.
prowlarr_app_profile_id: 1

# Proxies whose X-Forwarded-For Prowlarr should believe. Without this, *any*
# XFF header makes it treat the request as non-local — Traefik always sends one, so
# AuthenticationRequired=DisabledForLocalAddresses never applied through the proxy and
# every page, including the /MediaCover images the posters grid loads, redirected to the
# login form. With the LAN listed, a browser on the LAN is local again whether it goes
# direct or through Traefik, while anything arriving from outside still has to log in.
prowlarr_trusted_networks: "192.168.8.0/24"
