# The app link is what makes Prowlarr worth running: every indexer added in its UI is
# pushed into Radarr automatically (fullSync also removes the ones you delete). It lives
# in Prowlarr's SQLite DB, so the v1 API is the only way to set it. Guarded by a GET, so
# a hand-tuned link survives a re-run. The indexers themselves stay a UI job — which
# trackers to use is a per-site account decision, not something to template.
- name: Wait for the Prowlarr API
  ansible.builtin.uri:
    url: "{{ prowlarr_api_url }}/system/status"
    headers:
      X-Api-Key: "{{ vault_prowlarr_api_key }}"
    status_code: 200
  register: prowlarr_status
  # First boot builds the SQLite DB before the API answers, so this is a few minutes of
  # headroom, not the couple of seconds a restart needs.
  retries: 60
  delay: 5
  until: prowlarr_status is succeeded

- name: Read the configured applications
  ansible.builtin.uri:
    url: "{{ prowlarr_api_url }}/applications"
    headers:
      X-Api-Key: "{{ vault_prowlarr_api_key }}"
  register: prowlarr_applications

- name: Add Radarr as an application
  ansible.builtin.uri:
    url: "{{ prowlarr_api_url }}/applications"
    method: POST
    headers:
      X-Api-Key: "{{ vault_prowlarr_api_key }}"
    body_format: json
    body:
      name: Radarr
      implementation: Radarr
      implementationName: Radarr
      configContract: RadarrSettings
      # Prowlarr owns the indexer list: indexers added here are pushed to Radarr, and
      # ones removed here are removed there.
      syncLevel: fullSync
      tags: []
      fields:
        - name: prowlarrUrl
          value: "{{ prowlarr_self_url }}"
        - name: baseUrl
          value: "{{ prowlarr_radarr_url }}"
        - name: apiKey
          value: "{{ vault_radarr_api_key }}"
        - name: syncCategories
          value: "{{ prowlarr_radarr_sync_categories }}"
    status_code: [200, 201]
  when: "'Radarr' not in (prowlarr_applications.json | map(attribute='name') | list)"
  changed_when: true
  no_log: true

# An indexer is added by POSTing its definition back with enable + an app profile, so the
# catalog is fetched first rather than the payloads being spelled out here: the fields
# differ per definition and change with the definition itself.
- name: Read the indexer definitions
  ansible.builtin.uri:
    url: "{{ prowlarr_api_url }}/indexer/schema"
    headers:
      X-Api-Key: "{{ vault_prowlarr_api_key }}"
  register: prowlarr_indexer_schema

- name: Read the configured indexers
  ansible.builtin.uri:
    url: "{{ prowlarr_api_url }}/indexer"
    headers:
      X-Api-Key: "{{ vault_prowlarr_api_key }}"
  register: prowlarr_indexers_current

# Definitions get renamed and retired upstream, and a name that matches nothing would
# otherwise fail deep inside the loop with a Jinja error about an empty sequence.
- name: Check every requested indexer exists in the catalog
  ansible.builtin.assert:
    that: prowlarr_indexers | difference(prowlarr_indexer_schema.json | map(attribute='name') | list) == []
    fail_msg: >-
      No Prowlarr definition named
      {{ prowlarr_indexers | difference(prowlarr_indexer_schema.json | map(attribute='name') | list) | join(', ') }}
      — check the spelling against Prowlarr's Add Indexer list.

- name: Add the public indexers
  ansible.builtin.uri:
    url: "{{ prowlarr_api_url }}/indexer"
    method: POST
    headers:
      X-Api-Key: "{{ vault_prowlarr_api_key }}"
    body_format: json
    body: "{{ prowlarr_indexer_schema.json | selectattr('name', 'equalto', item) | first
              | combine({'enable': true, 'appProfileId': prowlarr_app_profile_id}) }}"
    status_code: [200, 201]
  loop: "{{ prowlarr_indexers }}"
  when: item not in (prowlarr_indexers_current.json | map(attribute='name') | list)
  changed_when: true
