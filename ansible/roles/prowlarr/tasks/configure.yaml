# The app link is what makes Prowlarr worth running: every indexer added in its UI is
# pushed into Radarr automatically (fullSync also removes the ones you delete). It lives
# in Prowlarr's SQLite DB, so the v1 API is the only way to set it. Guarded by a GET, so
# a hand-tuned link survives a re-run. The indexers themselves stay a UI job — which
# trackers to use is a per-site account decision, not something to template.
- name: Wait for the Prowlarr API
  ansible.builtin.uri:
    url: "{{ prowlarr_api_url }}/system/status"
    headers:
      X-Api-Key: "{{ vault_prowlarr_api_key }}"
    status_code: 200
  register: prowlarr_status
  # First boot builds the SQLite DB before the API answers, so this is a few minutes of
  # headroom, not the couple of seconds a restart needs.
  retries: 60
  delay: 5
  until: prowlarr_status is succeeded

- name: Read the configured applications
  ansible.builtin.uri:
    url: "{{ prowlarr_api_url }}/applications"
    headers:
      X-Api-Key: "{{ vault_prowlarr_api_key }}"
  register: prowlarr_applications

- name: Add Radarr as an application
  ansible.builtin.uri:
    url: "{{ prowlarr_api_url }}/applications"
    method: POST
    headers:
      X-Api-Key: "{{ vault_prowlarr_api_key }}"
    body_format: json
    body:
      name: Radarr
      implementation: Radarr
      implementationName: Radarr
      configContract: RadarrSettings
      # Prowlarr owns the indexer list: indexers added here are pushed to Radarr, and
      # ones removed here are removed there.
      syncLevel: fullSync
      tags: []
      fields:
        - name: prowlarrUrl
          value: "{{ prowlarr_self_url }}"
        - name: baseUrl
          value: "{{ prowlarr_radarr_url }}"
        - name: apiKey
          value: "{{ vault_radarr_api_key }}"
        - name: syncCategories
          value: "{{ prowlarr_radarr_sync_categories }}"
    status_code: [200, 201]
  when: "'Radarr' not in (prowlarr_applications.json | map(attribute='name') | list)"
  changed_when: true
  no_log: true
