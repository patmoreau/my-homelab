# The app link is what makes Prowlarr worth running: every indexer added in its UI is
# pushed into Radarr automatically (fullSync also removes the ones you delete). It lives
# in Prowlarr's SQLite DB, so the v1 API is the only way to set it. Guarded by a GET, so
# a hand-tuned link survives a re-run. The indexers themselves stay a UI job — which
# trackers to use is a per-site account decision, not something to template.
- name: Wait for the Prowlarr API
  ansible.builtin.uri:
    url: "{{ prowlarr_api_url }}/system/status"
    headers:
      X-Api-Key: "{{ vault_prowlarr_api_key }}"
    status_code: 200
  register: prowlarr_status
  # First boot builds the SQLite DB before the API answers, so this is a few minutes of
  # headroom, not the couple of seconds a restart needs.
  retries: 60
  delay: 5
  until: prowlarr_status is succeeded

- name: Read the configured applications
  ansible.builtin.uri:
    url: "{{ prowlarr_api_url }}/applications"
    headers:
      X-Api-Key: "{{ vault_prowlarr_api_key }}"
  register: prowlarr_applications_current

- name: Add the applications
  ansible.builtin.uri:
    url: "{{ prowlarr_api_url }}/applications"
    method: POST
    headers:
      X-Api-Key: "{{ vault_prowlarr_api_key }}"
    body_format: json
    body:
      name: "{{ item.name }}"
      implementation: "{{ item.implementation }}"
      implementationName: "{{ item.name }}"
      configContract: "{{ item.config_contract }}"
      # Prowlarr owns the indexer list: indexers added here are pushed to the app, and
      # ones removed here are removed there.
      syncLevel: fullSync
      tags: []
      fields:
        - name: prowlarrUrl
          value: "{{ prowlarr_self_url }}"
        - name: baseUrl
          value: "{{ item.base_url }}"
        - name: apiKey
          value: "{{ item.api_key }}"
        - name: syncCategories
          value: "{{ item.sync_categories }}"
    status_code: [200, 201]
  loop: "{{ prowlarr_applications }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name not in (prowlarr_applications_current.json | map(attribute='name') | list)
  changed_when: true
  no_log: true

# An indexer is added by POSTing its definition back with enable + an app profile, so the
# catalog is fetched first rather than the payloads being spelled out here: the fields
# differ per definition and change with the definition itself.
- name: Read the indexer definitions
  ansible.builtin.uri:
    url: "{{ prowlarr_api_url }}/indexer/schema"
    headers:
      X-Api-Key: "{{ vault_prowlarr_api_key }}"
  register: prowlarr_indexer_schema

- name: Read the configured indexers
  ansible.builtin.uri:
    url: "{{ prowlarr_api_url }}/indexer"
    headers:
      X-Api-Key: "{{ vault_prowlarr_api_key }}"
  register: prowlarr_indexers_current

# Definitions get renamed and retired upstream, and a name that matches nothing would
# otherwise fail deep inside the loop with a Jinja error about an empty sequence.
- name: Check every requested indexer exists in the catalog
  ansible.builtin.assert:
    that: (prowlarr_indexers + prowlarr_flaresolverr_indexers)
          | difference(prowlarr_indexer_schema.json | map(attribute='name') | list) == []
    fail_msg: >-
      No Prowlarr definition named
      {{ (prowlarr_indexers + prowlarr_flaresolverr_indexers)
         | difference(prowlarr_indexer_schema.json | map(attribute='name') | list) | join(', ') }}
      — check the spelling against Prowlarr's Add Indexer list.

- name: Add the public indexers
  ansible.builtin.uri:
    url: "{{ prowlarr_api_url }}/indexer"
    method: POST
    headers:
      X-Api-Key: "{{ vault_prowlarr_api_key }}"
    body_format: json
    body: "{{ prowlarr_indexer_schema.json | selectattr('name', 'equalto', item) | first
              | combine({'enable': true, 'appProfileId': prowlarr_app_profile_id}) }}"
    status_code: [200, 201]
  loop: "{{ prowlarr_indexers }}"
  when: item not in (prowlarr_indexers_current.json | map(attribute='name') | list)
  changed_when: true

# FlareSolverr is wired in as an indexer proxy, which Prowlarr applies by tag: only
# indexers carrying the `flaresolverr` tag are fetched through it, the rest go direct.
- name: Read the tags
  ansible.builtin.uri:
    url: "{{ prowlarr_api_url }}/tag"
    headers:
      X-Api-Key: "{{ vault_prowlarr_api_key }}"
  register: prowlarr_tags_current

- name: Create the flaresolverr tag
  ansible.builtin.uri:
    url: "{{ prowlarr_api_url }}/tag"
    method: POST
    headers:
      X-Api-Key: "{{ vault_prowlarr_api_key }}"
    body_format: json
    body:
      label: flaresolverr
    status_code: [200, 201]
  register: prowlarr_tag_created
  when: "'flaresolverr' not in (prowlarr_tags_current.json | map(attribute='label') | list)"
  changed_when: true

- name: Resolve the flaresolverr tag id
  ansible.builtin.set_fact:
    prowlarr_flaresolverr_tag_id: >-
      {{ prowlarr_tag_created.json.id if prowlarr_tag_created is changed
         else (prowlarr_tags_current.json | selectattr('label', 'equalto', 'flaresolverr') | first).id }}

- name: Read the indexer proxies
  ansible.builtin.uri:
    url: "{{ prowlarr_api_url }}/indexerProxy"
    headers:
      X-Api-Key: "{{ vault_prowlarr_api_key }}"
  register: prowlarr_proxies_current

- name: Add FlareSolverr as an indexer proxy
  ansible.builtin.uri:
    url: "{{ prowlarr_api_url }}/indexerProxy"
    method: POST
    headers:
      X-Api-Key: "{{ vault_prowlarr_api_key }}"
    body_format: json
    body:
      name: FlareSolverr
      implementation: FlareSolverr
      implementationName: FlareSolverr
      configContract: FlareSolverrSettings
      tags: "{{ [prowlarr_flaresolverr_tag_id | int] }}"
      fields:
        - name: host
          value: "{{ prowlarr_flaresolverr_url }}"
        # Seconds. A Cloudflare solve took 38-53 s in testing, so the 60 s default
        # would time out intermittently.
        - name: requestTimeout
          value: 120
    status_code: [200, 201]
  when: "'FlareSolverr' not in (prowlarr_proxies_current.json | map(attribute='name') | list)"
  changed_when: true

- name: Add the Cloudflare-protected indexers
  ansible.builtin.uri:
    url: "{{ prowlarr_api_url }}/indexer?forceSave=true"
    method: POST
    headers:
      X-Api-Key: "{{ vault_prowlarr_api_key }}"
    body_format: json
    body: "{{ prowlarr_indexer_schema.json | selectattr('name', 'equalto', item) | first
              | combine({'enable': true, 'appProfileId': prowlarr_app_profile_id,
                         'tags': [prowlarr_flaresolverr_tag_id | int]}) }}"
    status_code: [200, 201]
  loop: "{{ prowlarr_flaresolverr_indexers }}"
  when: item not in (prowlarr_indexers_current.json | map(attribute='name') | list)
  changed_when: true
