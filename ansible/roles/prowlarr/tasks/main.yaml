- name: Create directory
  ansible.builtin.file:
    path: "{{ docker_compose_dir }}/prowlarr"
    state: directory
    mode: "0755"

# /data/prowlarr itself must already exist — see the note in ansible/README.md: /data is a
# bind mount of the host's /mnt/containers/lxc-media, whose owner falls outside the
# container's nas_idmap range, so container root cannot create top-level entries there.
# Create it once on pve-homelab:
#   install -d -o 3000 -g 100 -m 0777 /mnt/containers/lxc-media/prowlarr
- name: Create data directory
  ansible.builtin.file:
    path: /data/prowlarr
    state: directory
    owner: "{{ nas_puid }}"
    group: "{{ nas_pgid }}"
    mode: "0777"

# Same reasoning as the radarr role: Prowlarr mints its own API key on first start, which
# would leave the vault — and with it the homepage widget and the API calls below —
# chasing a value only the container knows. force: false because Prowlarr owns the file
# from then on, rewriting it whenever settings are saved in the UI.
- name: Seed config.xml on first boot
  ansible.builtin.template:
    src: config.xml.j2
    dest: /data/prowlarr/config.xml
    owner: "{{ nas_puid }}"
    group: "{{ nas_pgid }}"
    mode: "0600"
    force: false

# Prowlarr owns config.xml after the seed above, so AllowedHosts is patched in place rather
# than re-templated — every other key keeps whatever the UI last set. Two tasks because
# an install that predates this may have no such tag at all: one rewrites an existing
# value, the other appends it. The slurp decides which, since a `replace` that matches
# nothing reports no change and cannot be used as the test.
- name: Read config.xml
  ansible.builtin.slurp:
    src: /data/prowlarr/config.xml
  register: prowlarr_config_raw

- name: Set AllowedHosts in config.xml
  ansible.builtin.replace:
    path: /data/prowlarr/config.xml
    regexp: '<AllowedHosts>[^<]*</AllowedHosts>'
    replace: '<AllowedHosts>{{ prowlarr_allowed_hosts }}</AllowedHosts>'
  when: '"<AllowedHosts>" in (prowlarr_config_raw.content | b64decode)'
  register: prowlarr_allowed_hosts_set

- name: Add AllowedHosts to config.xml when the tag is missing
  ansible.builtin.replace:
    path: /data/prowlarr/config.xml
    regexp: '</Config>'
    replace: '  <AllowedHosts>{{ prowlarr_allowed_hosts }}</AllowedHosts>\n</Config>'
  when: '"<AllowedHosts>" not in (prowlarr_config_raw.content | b64decode)'
  register: prowlarr_allowed_hosts_added

- name: Set TrustedNetworks in config.xml
  ansible.builtin.replace:
    path: /data/prowlarr/config.xml
    regexp: '<TrustedNetworks>[^<]*</TrustedNetworks>'
    replace: '<TrustedNetworks>{{ prowlarr_trusted_networks }}</TrustedNetworks>'
  when: '"<TrustedNetworks>" in (prowlarr_config_raw.content | b64decode)'
  register: prowlarr_trusted_networks_set

- name: Add TrustedNetworks to config.xml when the tag is missing
  ansible.builtin.replace:
    path: /data/prowlarr/config.xml
    regexp: '</Config>'
    replace: '  <TrustedNetworks>{{ prowlarr_trusted_networks }}</TrustedNetworks>\n</Config>'
  when: '"<TrustedNetworks>" not in (prowlarr_config_raw.content | b64decode)'
  register: prowlarr_trusted_networks_added

- name: Deploy via Podman Quadlet
  ansible.builtin.include_tasks: podman.yaml

- name: Register Radarr as a synced application
  ansible.builtin.include_tasks: configure.yaml
