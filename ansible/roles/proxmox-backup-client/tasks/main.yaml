---
# ---------------------------------------------------------------------------
# Proxmox Backup Client — Ubuntu 24.04 (Noble)
# Ubuntu 24.04 is binary-compatible with Proxmox Debian Bookworm packages.
# ---------------------------------------------------------------------------

- name: Ensure PBS hostname resolves via /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '.*{{ pbs_domain }}'
    line: "{{ hostvars['lxc-pbs']['ansible_host'] }}\t{{ pbs_domain }}"
    state: present

- name: Add Proxmox GPG key (Bookworm)
  ansible.builtin.get_url:
    url: https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg
    dest: /etc/apt/trusted.gpg.d/proxmox-release-bookworm.gpg
    mode: '0644'

- name: Add Proxmox PBS no-subscription repository (Bookworm)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/pbs-client-no-subscription.list
    content: |
      # Proxmox Backup Client — no-subscription repository (Debian Bookworm)
      deb http://download.proxmox.com/debian/pbs bookworm pbs-no-subscription
    mode: '0644'

- name: Disable any apt sources referencing the PBS enterprise repository
  ansible.builtin.shell: |
    set -o pipefail
    files=$(grep -rl "enterprise.proxmox.com/debian/pbs" /etc/apt/ 2>/dev/null || true)
    if [ -n "$files" ]; then
      echo "$files" | xargs rm -f
      echo "removed"
    else
      echo "not_found"
    fi
  args:
    executable: /bin/bash
  register: enterprise_removal
  changed_when: "'removed' in enterprise_removal.stdout"

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 0

- name: Install Proxmox Backup Client
  ansible.builtin.apt:
    name: proxmox-backup-client
    state: present

- name: Ensure proxmox-backup configuration directory exists
  ansible.builtin.file:
    path: /etc/proxmox-backup
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Discover PBS TLS fingerprint from endpoint when facts are unavailable
  ansible.builtin.shell: |
    set -o pipefail
    openssl s_client -connect {{ pbs_domain }}:8007 -servername {{ pbs_domain }} < /dev/null 2>/dev/null \
      | openssl x509 -noout -fingerprint -sha256 \
      | sed 's/.*=//' \
      | tr 'A-F' 'a-f'
  args:
    executable: /bin/bash
  register: pbs_discovered_fingerprint
  changed_when: false
  when:
    - hostvars.get('lxc-pbs', {}).get('pbs_cert_fingerprint', '') | length == 0
    - pbs_client_fingerprint is not defined or not pbs_client_fingerprint

- name: Resolve effective PBS client fingerprint
  ansible.builtin.set_fact:
    pbs_client_effective_fingerprint: >-
      {{
        hostvars.get('lxc-pbs', {}).get('pbs_cert_fingerprint', '')
        or (pbs_client_fingerprint | default(''))
        or (pbs_discovered_fingerprint.stdout | default(''))
      }}

- name: Ensure PBS client fingerprint is available
  ansible.builtin.assert:
    that:
      - pbs_client_effective_fingerprint | length > 0
    fail_msg: 'Unable to resolve PBS TLS fingerprint from lxc-pbs facts, pbs_client_fingerprint, or live endpoint {{ pbs_domain }}:8007'

- name: Deploy PBS client credentials file
  ansible.builtin.template:
    src: pbs-client.env.j2
    dest: /etc/proxmox-backup/pbs-client.env
    owner: root
    group: root
    mode: '0600'

- name: Create PBS backup systemd service
  ansible.builtin.template:
    src: pbs-backup.service.j2
    dest: /etc/systemd/system/pbs-backup.service
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd

- name: Create PBS backup systemd timer
  ansible.builtin.template:
    src: pbs-backup.timer.j2
    dest: /etc/systemd/system/pbs-backup.timer
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd
    - Enable and start PBS backup timer

- name: Ensure PBS backup timer is enabled and running
  ansible.builtin.systemd:
    name: pbs-backup.timer
    enabled: true
    state: started
    daemon_reload: true
