---
pbs_datastore_name: nas-backups
pbs_datastore_path: /mnt/nas-backups/datastore

# Matches node_exporter_pkg's textfile directory. This host used to run a hand-installed
# binary exporter pointed at /var/lib/node_exporter; that unit is retired by node_exporter_pkg,
# which runs before this role in the play.
pbs_textfile_dir: "{{ node_exporter_pkg_textfile_dir | default('/var/lib/prometheus/node-exporter') }}"
