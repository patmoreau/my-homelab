---
# ---------------------------------------------------------------------------
# Proxmox Backup Server — Debian 13 (Trixie)
# ---------------------------------------------------------------------------

- name: Add Proxmox Backup Server GPG key
  ansible.builtin.get_url:
    url: https://enterprise.proxmox.com/debian/proxmox-release-trixie.gpg
    dest: /etc/apt/trusted.gpg.d/proxmox-release-trixie.gpg
    mode: '0644'

- name: Add Proxmox Backup Server no-subscription repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/pbs-no-subscription.list
    content: |
      # Proxmox Backup Server — no-subscription repository (Debian 13 Trixie)
      deb http://download.proxmox.com/debian/pbs trixie pbs-no-subscription
    mode: '0644'

- name: Disable any apt sources referencing the PBS enterprise repository
  ansible.builtin.shell: |
    set -o pipefail
    files=$(grep -rl "enterprise.proxmox.com/debian/pbs" /etc/apt/ 2>/dev/null || true)
    if [ -n "$files" ]; then
      echo "$files" | xargs rm -f
      echo "removed"
    else
      echo "not_found"
    fi
  args:
    executable: /bin/bash
  register: enterprise_removal
  changed_when: "'removed' in enterprise_removal.stdout"

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 0

- name: Install Proxmox Backup Server
  ansible.builtin.apt:
    name: proxmox-backup-server
    state: present

- name: Disable PBS enterprise repository created by post-install script
  ansible.builtin.shell: |
    set -o pipefail
    files=$(grep -rl "enterprise.proxmox.com/debian/pbs" /etc/apt/ 2>/dev/null || true)
    if [ -n "$files" ]; then
      echo "$files" | xargs rm -f
      echo "removed"
    else
      echo "not_found"
    fi
  args:
    executable: /bin/bash
  register: enterprise_removal_post
  changed_when: "'removed' in enterprise_removal_post.stdout"

- name: Ensure PBS service is enabled and started
  ansible.builtin.systemd:
    name: proxmox-backup
    enabled: true
    state: started

- name: Wait for PBS API to become ready
  ansible.builtin.wait_for:
    port: 8007
    host: '127.0.0.1'
    delay: 5
    timeout: 60

# ---------------------------------------------------------------------------
# NAS mount permissions
# ---------------------------------------------------------------------------

- name: Create svc-backup user matching NAS UID
  ansible.builtin.user:
    name: svc-backup
    uid: 3001
    group: users
    shell: /usr/sbin/nologin
    system: true

- name: Add backup user to users group for NAS mount access
  ansible.builtin.user:
    name: backup
    groups: users
    append: true

# ---------------------------------------------------------------------------
# Configure admin user — pmoreau@pbs mapped to the PVE PAM account
# PBS manages its own user database; we create a matching local user and
# grant it the Admin role on / so it has full root-equivalent access.
# ---------------------------------------------------------------------------

- name: Check if PBS admin user already exists
  ansible.builtin.command:
    cmd: proxmox-backup-manager user list --output-format json
  register: pbs_users
  changed_when: false

- name: Create PBS admin user ({{ vault_pbs_admin_username }})
  ansible.builtin.command:
    cmd: >
      proxmox-backup-manager user create {{ vault_pbs_admin_username }}
      --password {{ vault_pbs_admin_password }}
      --email {{ vault_pbs_admin_email }}
      --comment "Homelab admin — mirrors PVE pmoreau@pam"
      --enable true
  when: vault_pbs_admin_username not in pbs_users.stdout
  changed_when: true
  no_log: true

- name: Grant Admin role on / to PBS admin user
  ansible.builtin.command:
    cmd: >
      proxmox-backup-manager acl update / Admin
      --auth-id {{ vault_pbs_admin_username }}
      --propagate true
  register: acl_result
  changed_when: acl_result.rc == 0
  # Idempotent: re-applying the same ACL is a no-op on PBS

# ---------------------------------------------------------------------------
# TLS certificate deployment from Traefik certs-dumper
# The traefik-certs-dumper sidecar (running on lxc-gateway) SSHes the
# Let's Encrypt cert here and restarts proxmox-backup-proxy automatically.
# We only need to authorise its deploy key on this host.
# ---------------------------------------------------------------------------

- name: Authorize traefik-certs-dumper deploy key on PBS
  ansible.posix.authorized_key:
    user: root
    key: "{{ hostvars['lxc-gateway']['certs_dumper_keypair']['public_key'] }}"
    comment: traefik-certs-dumper@lxc-gateway
    state: present
  when: hostvars['lxc-gateway']['certs_dumper_keypair'] is defined

# ---------------------------------------------------------------------------
# Datastore Auto-Provisioning
# Bypasses NFS chown restrictions for unprivileged containers
# ---------------------------------------------------------------------------

- name: Check if datastore is already initialized
  ansible.builtin.stat:
    path: /mnt/nas-backups/datastore/.chunks
  register: datastore_chunks

- name: Pre-create datastore chunk directories as backup user
  ansible.builtin.shell: |
    mkdir -p /mnt/nas-backups/datastore/.chunks
    cd /mnt/nas-backups/datastore/.chunks
    for i in {0..255}; do
        prefix=$(printf "%02x" $i)
        mkdir -p $(printf "${prefix}%02x " {0..255})
    done
  args:
    executable: /bin/bash
  environment:
    ANSIBLE_REMOTE_TMP: /tmp
  become: true
  become_user: backup
  become_method: ansible.builtin.su
  become_flags: '-s /bin/bash'
  when: not datastore_chunks.stat.exists
  changed_when: true

- name: Ensure PBS datastore configuration file exists
  ansible.builtin.copy:
    dest: /etc/proxmox-backup/datastore.cfg
    content: ''
    force: false
    owner: backup
    group: backup
    mode: '0640'

- name: Clean up legacy Ansible markers from PBS config
  ansible.builtin.lineinfile:
    path: /etc/proxmox-backup/datastore.cfg
    regexp: '^# (BEGIN|END) ANSIBLE MANAGED BLOCK'
    state: absent

- name: Register datastore in Proxmox Backup Server configuration
  ansible.builtin.shell: |
    set -o pipefail
    if ! grep -q "datastore: nas-backups" /etc/proxmox-backup/datastore.cfg; then
        printf "\ndatastore: nas-backups\n    path /mnt/nas-backups/datastore\n" >> /etc/proxmox-backup/datastore.cfg
        echo "changed"
    fi
  args:
    executable: /bin/bash
  register: datastore_cfg
  changed_when: "'changed' in datastore_cfg.stdout"
  notify: Reload PBS proxy

# ---------------------------------------------------------------------------
# Backup retention and cleanup policy
# ---------------------------------------------------------------------------

- name: List existing PBS prune jobs
  ansible.builtin.command:
    cmd: proxmox-backup-manager prune-job list --output-format json
  register: pbs_prune_jobs
  changed_when: false

- name: Create prune job for nas-backups datastore
  ansible.builtin.command:
    cmd: >
      proxmox-backup-manager prune-job create nas-backups-daily
      --store nas-backups
      --schedule {{ pbs_prune_schedule }}
      --keep-last {{ pbs_prune_keep_last }}
      --keep-daily {{ pbs_prune_keep_daily }}
      --keep-weekly {{ pbs_prune_keep_weekly }}
      --keep-monthly {{ pbs_prune_keep_monthly }}
  when: "'\"id\":\"nas-backups-daily\"' not in (pbs_prune_jobs.stdout | regex_replace('\\s+', ''))"
  changed_when: true

- name: Enforce retention settings on nas-backups prune job
  ansible.builtin.command:
    cmd: >
      proxmox-backup-manager prune-job update nas-backups-daily
      --schedule {{ pbs_prune_schedule }}
      --keep-last {{ pbs_prune_keep_last }}
      --keep-daily {{ pbs_prune_keep_daily }}
      --keep-weekly {{ pbs_prune_keep_weekly }}
      --keep-monthly {{ pbs_prune_keep_monthly }}
  changed_when: false

- name: Enforce datastore garbage-collection schedule
  ansible.builtin.command:
    cmd: >
      proxmox-backup-manager datastore update nas-backups
      --gc-schedule {{ pbs_gc_schedule }}
  changed_when: false

# ---------------------------------------------------------------------------
# Backup client service account
# A dedicated pbs-realm user (backup-client@pbs) is created with the
# vault-managed password so any LXC container running proxmox-backup-client
# can use the same credentials without manual token generation.
# ---------------------------------------------------------------------------

- name: Check if backup-client@pbs user already exists
  ansible.builtin.command:
    cmd: proxmox-backup-manager user list --output-format json
  register: pbs_all_users
  changed_when: false

- name: Create backup-client@pbs user
  ansible.builtin.command:
    cmd: >
      proxmox-backup-manager user create backup-client@pbs
      --password {{ vault_pbs_client_password }}
      --comment "Ansible backup client — used by all LXC backup jobs"
      --enable true
  when: "'backup-client@pbs' not in pbs_all_users.stdout"
  changed_when: true
  no_log: true

- name: Grant DatastoreBackup ACL to backup-client@pbs on nas-backups datastore
  ansible.builtin.command:
    cmd: >
      proxmox-backup-manager acl update /datastore/nas-backups DatastoreBackup
      --auth-id backup-client@pbs
  changed_when: false
  # Idempotent: re-applying the same ACL is a no-op on PBS

# ---------------------------------------------------------------------------
# Expose TLS fingerprint as a host fact so proxmox-backup-client roles
# can write it into their env file without interactive prompts.
# ---------------------------------------------------------------------------

- name: Read PBS TLS certificate fingerprint
  ansible.builtin.command:
    cmd: openssl x509 -noout -fingerprint -sha256 -in /etc/proxmox-backup/proxy.pem
  register: pbs_cert_fingerprint_raw
  changed_when: false
  failed_when: pbs_cert_fingerprint_raw.rc != 0

- name: Set pbs_cert_fingerprint host fact
  ansible.builtin.set_fact:
    pbs_cert_fingerprint: "{{ pbs_cert_fingerprint_raw.stdout | regex_replace('.*=', '') | lower }}"
