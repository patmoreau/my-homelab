---
# ---------------------------------------------------------------------------
# Proxmox Backup Server — Debian 13 (Trixie)
# ---------------------------------------------------------------------------

- name: Add Proxmox Backup Server GPG key
  ansible.builtin.get_url:
    url: https://enterprise.proxmox.com/debian/proxmox-release-trixie.gpg
    dest: /etc/apt/trusted.gpg.d/proxmox-release-trixie.gpg
    mode: '0644'

- name: Add Proxmox Backup Server no-subscription repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/pbs-no-subscription.list
    content: |
      # Proxmox Backup Server — no-subscription repository (Debian 13 Trixie)
      deb http://download.proxmox.com/debian/pbs trixie pbs-no-subscription
    mode: '0644'

- name: Disable any apt sources referencing the PBS enterprise repository
  ansible.builtin.shell: |
    set -o pipefail
    files=$(grep -rl "enterprise.proxmox.com/debian/pbs" /etc/apt/ 2>/dev/null || true)
    if [ -n "$files" ]; then
      echo "$files" | xargs rm -f
      echo "removed"
    else
      echo "not_found"
    fi
  args:
    executable: /bin/bash
  register: enterprise_removal
  changed_when: "'removed' in enterprise_removal.stdout"

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 0

- name: Install Proxmox Backup Server
  ansible.builtin.apt:
    name: proxmox-backup-server
    state: present

- name: Disable PBS enterprise repository created by post-install script
  ansible.builtin.shell: |
    set -o pipefail
    files=$(grep -rl "enterprise.proxmox.com/debian/pbs" /etc/apt/ 2>/dev/null || true)
    if [ -n "$files" ]; then
      echo "$files" | xargs rm -f
      echo "removed"
    else
      echo "not_found"
    fi
  args:
    executable: /bin/bash
  register: enterprise_removal_post
  changed_when: "'removed' in enterprise_removal_post.stdout"

- name: Ensure PBS service is enabled and started
  ansible.builtin.systemd:
    name: proxmox-backup
    enabled: true
    state: started

- name: Wait for PBS API to become ready
  ansible.builtin.wait_for:
    port: 8007
    host: '127.0.0.1'
    delay: 5
    timeout: 60

# ---------------------------------------------------------------------------
# NAS mount permissions
# ---------------------------------------------------------------------------

- name: Create svc-backup user matching NAS UID
  ansible.builtin.user:
    name: svc-backup
    uid: 3001
    group: users
    shell: /usr/sbin/nologin
    system: true

- name: Add backup user to users group for NAS mount access
  ansible.builtin.user:
    name: backup
    groups: users
    append: true

# ---------------------------------------------------------------------------
# Configure admin user — pmoreau@pbs mapped to the PVE PAM account
# PBS manages its own user database; we create a matching local user and
# grant it the Admin role on / so it has full root-equivalent access.
# ---------------------------------------------------------------------------

- name: Check if PBS admin user already exists
  ansible.builtin.command:
    cmd: proxmox-backup-manager user list --output-format json
  register: pbs_users
  changed_when: false

- name: Create PBS admin user ({{ vault_pbs_admin_username }})
  ansible.builtin.command:
    cmd: >
      proxmox-backup-manager user create {{ vault_pbs_admin_username }}
      --password {{ vault_pbs_admin_password }}
      --email {{ vault_pbs_admin_email }}
      --comment "Homelab admin — mirrors PVE pmoreau@pam"
      --enable true
  when: vault_pbs_admin_username not in pbs_users.stdout
  changed_when: true
  no_log: true

- name: Grant Admin role on / to PBS admin user
  ansible.builtin.command:
    cmd: >
      proxmox-backup-manager acl update / Admin
      --auth-id {{ vault_pbs_admin_username }}
      --propagate true
  register: acl_result
  changed_when: acl_result.rc == 0
  # Idempotent: re-applying the same ACL is a no-op on PBS

# A token's effective privileges are the intersection of its own ACL and its user's, so
# the Audit role has to be granted to the token itself even though the user above is
# Admin. The token is minted by hand once — `proxmox-backup-manager user generate-token`
# reveals the secret only at creation, so there is nothing for Ansible to reconcile
# against; the id and secret live in the vault. Only the ACL is managed here.
- name: Grant Audit role on / to the homepage API token
  ansible.builtin.command:
    cmd: >
      proxmox-backup-manager acl update / Audit
      --auth-id "{{ vault_pbs_token_id }}"
      --propagate true
  register: pbs_token_acl_result
  changed_when: pbs_token_acl_result.rc == 0
  # Idempotent: re-applying the same ACL is a no-op on PBS

# ---------------------------------------------------------------------------
# TLS certificate deployment from Traefik certs-dumper
# The traefik-certs-dumper sidecar (running on lxc-gateway) SSHes the
# Let's Encrypt cert here and restarts proxmox-backup-proxy automatically.
# We only need to authorise its deploy key on this host.
# ---------------------------------------------------------------------------

- name: Authorize traefik-certs-dumper deploy key on PBS
  ansible.posix.authorized_key:
    user: root
    key: "{{ hostvars['lxc-gateway']['certs_dumper_keypair']['public_key'] }}"
    comment: traefik-certs-dumper@lxc-gateway
    state: present
  when: hostvars['lxc-gateway']['certs_dumper_keypair'] is defined

# ---------------------------------------------------------------------------
# Datastore Auto-Provisioning
# Bypasses NFS chown restrictions for unprivileged containers
# ---------------------------------------------------------------------------

- name: Check if datastore is already initialized
  ansible.builtin.stat:
    path: /mnt/nas-backups/datastore/.chunks
  register: datastore_chunks

- name: Pre-create datastore chunk directories as backup user
  ansible.builtin.shell: |
    mkdir -p /mnt/nas-backups/datastore/.chunks
    cd /mnt/nas-backups/datastore/.chunks
    for i in {0..255}; do
        prefix=$(printf "%02x" $i)
        mkdir -p $(printf "${prefix}%02x " {0..255})
    done
  args:
    executable: /bin/bash
  environment:
    ANSIBLE_REMOTE_TMP: /tmp
  become: true
  become_user: backup
  become_method: ansible.builtin.su
  become_flags: '-s /bin/bash'
  when: not datastore_chunks.stat.exists
  changed_when: true

- name: Ensure PBS datastore configuration file exists
  ansible.builtin.copy:
    dest: /etc/proxmox-backup/datastore.cfg
    content: ''
    force: false
    owner: backup
    group: backup
    mode: '0640'

- name: Clean up legacy Ansible markers from PBS config
  ansible.builtin.lineinfile:
    path: /etc/proxmox-backup/datastore.cfg
    regexp: '^# (BEGIN|END) ANSIBLE MANAGED BLOCK'
    state: absent

- name: Register datastore in Proxmox Backup Server configuration
  ansible.builtin.shell: |
    set -o pipefail
    if ! grep -q "datastore: nas-backups" /etc/proxmox-backup/datastore.cfg; then
        printf "\ndatastore: nas-backups\n    path /mnt/nas-backups/datastore\n" >> /etc/proxmox-backup/datastore.cfg
        echo "changed"
    fi
  args:
    executable: /bin/bash
  register: datastore_cfg
  changed_when: "'changed' in datastore_cfg.stdout"
  notify: Reload PBS proxy

# ---------------------------------------------------------------------------
# Backup retention and cleanup policy
# ---------------------------------------------------------------------------

- name: List existing PBS prune jobs
  ansible.builtin.command:
    cmd: proxmox-backup-manager prune-job list --output-format json
  register: pbs_prune_jobs
  changed_when: false

- name: Create prune job for nas-backups datastore
  ansible.builtin.command:
    cmd: >
      proxmox-backup-manager prune-job create nas-backups-daily
      --store nas-backups
      --schedule {{ pbs_prune_schedule }}
      --keep-last {{ pbs_prune_keep_last }}
      --keep-daily {{ pbs_prune_keep_daily }}
      --keep-weekly {{ pbs_prune_keep_weekly }}
      --keep-monthly {{ pbs_prune_keep_monthly }}
  when: "'\"id\":\"nas-backups-daily\"' not in (pbs_prune_jobs.stdout | regex_replace('\\s+', ''))"
  changed_when: true

- name: Enforce retention settings on nas-backups prune job
  ansible.builtin.command:
    cmd: >
      proxmox-backup-manager prune-job update nas-backups-daily
      --schedule {{ pbs_prune_schedule }}
      --keep-last {{ pbs_prune_keep_last }}
      --keep-daily {{ pbs_prune_keep_daily }}
      --keep-weekly {{ pbs_prune_keep_weekly }}
      --keep-monthly {{ pbs_prune_keep_monthly }}
  changed_when: false

- name: Enforce datastore garbage-collection schedule
  ansible.builtin.command:
    cmd: >
      proxmox-backup-manager datastore update nas-backups
      --gc-schedule {{ pbs_gc_schedule }}
  changed_when: false

# ---------------------------------------------------------------------------
# Offsite S3 datastore
# ---------------------------------------------------------------------------

- name: List configured S3 endpoints
  ansible.builtin.command:
    cmd: proxmox-backup-manager s3 endpoint list --output-format json
  register: pbs_s3_endpoints
  changed_when: false

- name: Create the R2 endpoint
  ansible.builtin.command:
    cmd: >
      proxmox-backup-manager s3 endpoint create {{ pbs_s3_endpoint_id }}
      --endpoint {{ pbs_s3_endpoint_host }}
      --region {{ pbs_s3_region }}
      --access-key {{ vault_pbs_s3_access_key }}
      --secret-key {{ vault_pbs_s3_secret_key }}
      --path-style {{ pbs_s3_path_style | bool | lower }}
      {% for quirk in pbs_s3_provider_quirks %}--provider-quirks {{ quirk }} {% endfor %}
  when: "'\"id\":\"' ~ pbs_s3_endpoint_id ~ '\"' not in (pbs_s3_endpoints.stdout | regex_replace('\\s+', ''))"
  changed_when: true
  no_log: true

- name: Enforce the R2 endpoint settings
  ansible.builtin.command:
    cmd: >
      proxmox-backup-manager s3 endpoint update {{ pbs_s3_endpoint_id }}
      --endpoint {{ pbs_s3_endpoint_host }}
      --region {{ pbs_s3_region }}
      --access-key {{ vault_pbs_s3_access_key }}
      --secret-key {{ vault_pbs_s3_secret_key }}
      --path-style {{ pbs_s3_path_style | bool | lower }}
  changed_when: false
  no_log: true

# Fails loudly here rather than halfway through the first sync if the credentials, endpoint
# or addressing style are wrong.
- name: Check the bucket is reachable
  ansible.builtin.command:
    cmd: proxmox-backup-manager s3 check {{ pbs_s3_endpoint_id }} {{ pbs_s3_bucket }}
  register: pbs_s3_check
  changed_when: false

- name: Ensure the S3 datastore cache directory exists
  ansible.builtin.file:
    path: "{{ pbs_s3_cache_path }}/{{ pbs_s3_datastore_name }}"
    state: directory
    owner: backup
    group: backup
    mode: "0750"

- name: List datastores
  ansible.builtin.command:
    cmd: proxmox-backup-manager datastore list --output-format json
  register: pbs_datastores
  changed_when: false

# The positional path is the local cache, not the data: chunks live in the bucket. Backend
# syntax is type=s3,client=<endpoint id>,bucket=<bucket> — `client` refers to the s3 endpoint
# config created above.
- name: Create the offsite S3 datastore
  ansible.builtin.command:
    cmd: >
      proxmox-backup-manager datastore create {{ pbs_s3_datastore_name }}
      {{ pbs_s3_cache_path }}/{{ pbs_s3_datastore_name }}
      --backend type=s3,client={{ pbs_s3_endpoint_id }},bucket={{ pbs_s3_bucket }}
  when: "'\"name\":\"' ~ pbs_s3_datastore_name ~ '\"' not in (pbs_datastores.stdout | regex_replace('\\s+', ''))"
  changed_when: true

# Local-to-local sync: --store is the target, --remote-store the source, and omitting
# --remote keeps both on this server. This is what actually puts the backups offsite; the
# datastore above is only the destination.
#
# --encrypted-only: nothing unencrypted leaves the house. Snapshots predating client-side
# encryption stay local and age out under the prune policy rather than being shipped to
# Cloudflare in the clear.
#
# --remove-vanished false, deliberately: a snapshot pruned or deleted locally is NOT removed
# from R2 by the sync. That costs some storage, and it is the point — a local wipe, whether
# ransomware or a mistake, cannot propagate to the offsite copy through this job. R2 is pruned
# on its own schedule instead (the prune job below).
- name: List sync jobs
  ansible.builtin.command:
    cmd: proxmox-backup-manager sync-job list --output-format json
  register: pbs_sync_jobs
  changed_when: false

- name: Create the offsite sync job
  ansible.builtin.command:
    cmd: >
      proxmox-backup-manager sync-job create {{ pbs_s3_datastore_name }}-sync
      --store {{ pbs_s3_datastore_name }}
      --remote-store {{ pbs_datastore_name }}
      --schedule "{{ pbs_s3_sync_schedule }}"
      --encrypted-only true
      --remove-vanished false
  when: "'\"id\":\"' ~ pbs_s3_datastore_name ~ '-sync\"' not in (pbs_sync_jobs.stdout | regex_replace('\\s+', ''))"
  changed_when: true

- name: Enforce the offsite sync schedule
  ansible.builtin.command:
    cmd: >
      proxmox-backup-manager sync-job update {{ pbs_s3_datastore_name }}-sync
      --schedule "{{ pbs_s3_sync_schedule }}"
  changed_when: false

# Verification matters more on the copy nobody looks at than on the one nearby.
# Its own listing rather than reusing pbs_verify_jobs: that is registered further down, in the
# section covering the local datastore, so it does not exist yet at this point in the play.
- name: List verify jobs before configuring the offsite one
  ansible.builtin.command:
    cmd: proxmox-backup-manager verify-job list --output-format json
  register: pbs_s3_verify_jobs
  changed_when: false

- name: Create verify job for the offsite datastore
  ansible.builtin.command:
    cmd: >
      proxmox-backup-manager verify-job create {{ pbs_s3_datastore_name }}-verify
      --store {{ pbs_s3_datastore_name }}
      --schedule {{ pbs_s3_verify_schedule }}
      --ignore-verified true
      --outdated-after {{ pbs_verify_outdated_after }}
  when: "'\"id\":\"' ~ pbs_s3_datastore_name ~ '-verify\"' not in (pbs_s3_verify_jobs.stdout | regex_replace('\\s+', ''))"
  changed_when: true

- name: Create prune job for the offsite datastore
  ansible.builtin.command:
    cmd: >
      proxmox-backup-manager prune-job create {{ pbs_s3_datastore_name }}-prune
      --store {{ pbs_s3_datastore_name }}
      --schedule {{ pbs_prune_schedule }}
      --keep-last {{ pbs_prune_keep_last }}
      --keep-daily {{ pbs_prune_keep_daily }}
      --keep-weekly {{ pbs_prune_keep_weekly }}
      --keep-monthly {{ pbs_prune_keep_monthly }}
  when: "'\"id\":\"' ~ pbs_s3_datastore_name ~ '-prune\"' not in (pbs_prune_jobs.stdout | regex_replace('\\s+', ''))"
  changed_when: true

# ---------------------------------------------------------------------------
# Datastore metrics
# Nothing exported the datastore's size: node_exporter's filesystem collector reports the whole
# 8.4T NFS share, not the 32G of chunks inside it, so there was no way to see growth or to
# notice a host that had stopped backing up. Parsed out of the GC log rather than measured with
# du — see the script for why that matters on an array that is half SMR.
# ---------------------------------------------------------------------------

# The hand-installed exporter this host used to run read /var/lib/node_exporter; the packaged
# one reads /var/lib/prometheus/node-exporter. A .prom left in the old path would go stale
# rather than disappear, so it is removed explicitly.
- name: Remove metrics from the retired textfile directory
  ansible.builtin.file:
    path: /var/lib/node_exporter/pbs_datastore.prom
    state: absent

- name: Deploy the datastore metrics script
  ansible.builtin.copy:
    src: pbs-datastore-metrics.sh
    dest: /usr/local/bin/pbs-datastore-metrics
    owner: root
    group: root
    mode: "0755"

- name: Deploy the datastore metrics service
  ansible.builtin.template:
    src: pbs-datastore-metrics.service.j2
    dest: /etc/systemd/system/pbs-datastore-metrics.service
    owner: root
    group: root
    mode: "0644"

- name: Deploy the datastore metrics timer
  ansible.builtin.template:
    src: pbs-datastore-metrics.timer.j2
    dest: /etc/systemd/system/pbs-datastore-metrics.timer
    owner: root
    group: root
    mode: "0644"

- name: Ensure the datastore metrics timer is enabled and running
  ansible.builtin.systemd:
    name: pbs-datastore-metrics.timer
    enabled: true
    state: started
    daemon_reload: true

# ---------------------------------------------------------------------------
# Verification
# Bit rot and truncated chunks are silent: the datastore reports a healthy snapshot list either
# way, and the failure surfaces only during a restore. A verify job re-reads the chunks and
# checks them against their digests on a schedule instead. Encrypted chunks verify the same way
# — the digest covers the ciphertext, so no key is needed on the server.
# ---------------------------------------------------------------------------

- name: List existing PBS verify jobs
  ansible.builtin.command:
    cmd: proxmox-backup-manager verify-job list --output-format json
  register: pbs_verify_jobs
  changed_when: false

- name: Create verify job for nas-backups datastore
  ansible.builtin.command:
    cmd: >
      proxmox-backup-manager verify-job create nas-backups-verify
      --store nas-backups
      --schedule {{ pbs_verify_schedule }}
      --ignore-verified true
      --outdated-after {{ pbs_verify_outdated_after }}
  when: "'\"id\":\"nas-backups-verify\"' not in (pbs_verify_jobs.stdout | regex_replace('\\s+', ''))"
  changed_when: true

- name: Enforce settings on nas-backups verify job
  ansible.builtin.command:
    cmd: >
      proxmox-backup-manager verify-job update nas-backups-verify
      --schedule {{ pbs_verify_schedule }}
      --ignore-verified true
      --outdated-after {{ pbs_verify_outdated_after }}
  changed_when: false

# ---------------------------------------------------------------------------
# Backup client service account
# A dedicated pbs-realm user (backup-client@pbs) is created with the
# vault-managed password so any LXC container running proxmox-backup-client
# can use the same credentials without manual token generation.
# ---------------------------------------------------------------------------

- name: Check if backup-client@pbs user already exists
  ansible.builtin.command:
    cmd: proxmox-backup-manager user list --output-format json
  register: pbs_all_users
  changed_when: false

- name: Create backup-client@pbs user
  ansible.builtin.command:
    cmd: >
      proxmox-backup-manager user create backup-client@pbs
      --password {{ vault_pbs_client_password }}
      --comment "Ansible backup client — used by all LXC backup jobs"
      --enable true
  when: "'backup-client@pbs' not in pbs_all_users.stdout"
  changed_when: true
  no_log: true

# Both datastores, not just the local one. A new datastore grants nobody anything by
# default, so the offsite copy was unreadable to the very account that would restore from it —
# `permission check failed - missing Datastore.Audit|Datastore.Backup on /datastore/r2-offsite`.
# Caught by actually attempting a restore rather than by the sync, which runs as root@pam.
- name: Grant DatastoreBackup ACL to backup-client@pbs on each datastore
  ansible.builtin.command:
    cmd: >
      proxmox-backup-manager acl update /datastore/{{ item }} DatastoreBackup
      --auth-id backup-client@pbs
  loop:
    - "{{ pbs_datastore_name }}"
    - "{{ pbs_s3_datastore_name }}"
  changed_when: false
  # Idempotent: re-applying the same ACL is a no-op on PBS

# DatastoreBackup only exposes groups the account owns, and the sync job runs as root@pam —
# so everything in the offsite datastore is owned by root@pam and was invisible to
# backup-client@pbs, which could write there but not list or restore. DatastoreReader grants
# read of every group, which is what a restore from the offsite copy actually needs.
- name: Grant DatastoreReader ACL to backup-client@pbs on the offsite datastore
  ansible.builtin.command:
    cmd: >
      proxmox-backup-manager acl update /datastore/{{ pbs_s3_datastore_name }} DatastoreReader
      --auth-id backup-client@pbs
  changed_when: false

# ---------------------------------------------------------------------------
# Expose TLS fingerprint as a host fact so proxmox-backup-client roles
# can write it into their env file without interactive prompts.
# ---------------------------------------------------------------------------

- name: Read PBS TLS certificate fingerprint
  ansible.builtin.command:
    cmd: openssl x509 -noout -fingerprint -sha256 -in /etc/proxmox-backup/proxy.pem
  register: pbs_cert_fingerprint_raw
  changed_when: false
  failed_when: pbs_cert_fingerprint_raw.rc != 0

- name: Set pbs_cert_fingerprint host fact
  ansible.builtin.set_fact:
    pbs_cert_fingerprint: "{{ pbs_cert_fingerprint_raw.stdout | regex_replace('.*=', '') | lower }}"
