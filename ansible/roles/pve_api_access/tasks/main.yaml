---
# --- Groups -----------------------------------------------------------------
- name: Query PVE groups
  ansible.builtin.command: pveum group list --output-format json
  register: pve_groups_raw
  changed_when: false
  check_mode: false

- name: Ensure API groups exist
  ansible.builtin.command: "pveum group add {{ item }}"
  loop: "{{ pve_api_groups }}"
  when: item not in (pve_groups_raw.stdout | from_json | map(attribute='groupid') | list)
  changed_when: true

# --- Users ------------------------------------------------------------------
- name: Query PVE users
  ansible.builtin.command: pveum user list --output-format json
  register: pve_users_raw
  changed_when: false
  check_mode: false

- name: Ensure API users exist
  ansible.builtin.command: "pveum user add {{ item }}"
  loop: "{{ pve_api_users }}"
  when: item not in (pve_users_raw.stdout | from_json | map(attribute='userid') | list)
  changed_when: true

# --- Tokens -----------------------------------------------------------------
- name: Query existing tokens per user
  ansible.builtin.command: "pveum user token list {{ item.userid }} --output-format json"
  loop: "{{ pve_api_tokens }}"
  loop_control:
    label: "{{ item.userid }}!{{ item.tokenid }}"
  register: pve_token_checks
  changed_when: false
  check_mode: false

- name: Create API tokens (when missing)
  ansible.builtin.command: >-
    pveum user token add {{ item.item.userid }} {{ item.item.tokenid }}
    --privsep {{ item.item.privsep }}
  loop: "{{ pve_token_checks.results }}"
  loop_control:
    label: "{{ item.item.userid }}!{{ item.item.tokenid }}"
  when: item.item.tokenid not in (item.stdout | from_json | map(attribute='tokenid') | list)
  changed_when: true
  register: pve_tokens_created

# Enforce privilege separation on tokens that already exist but drift from the desired
# value. `token modify` changes privsep WITHOUT regenerating the secret, so the vault is
# untouched.
- name: Reconcile token privilege separation (existing tokens)
  ansible.builtin.command: >-
    pveum user token modify {{ item.item.userid }} {{ item.item.tokenid }}
    --privsep {{ item.item.privsep }}
  loop: "{{ pve_token_checks.results }}"
  loop_control:
    label: "{{ item.item.userid }}!{{ item.item.tokenid }}"
  vars:
    _existing: "{{ item.stdout | from_json | selectattr('tokenid', 'equalto', item.item.tokenid) | list }}"
  when:
    - _existing | length > 0
    - (_existing[0].privsep | int) != (item.item.privsep | int)
  changed_when: true

# A token secret is shown ONLY in the creation output. If any token was created here,
# its secret must be copied into the vault (vault_pve_token_secret / Terraform creds).
- name: Warn to store any newly created token secret
  ansible.builtin.debug:
    msg: >-
      Token {{ item.item.item.userid }}!{{ item.item.item.tokenid }} was just created —
      copy its secret from the task output into the vault; it cannot be retrieved later.
  loop: "{{ pve_tokens_created.results }}"
  loop_control:
    label: "{{ item.item.item.userid }}!{{ item.item.item.tokenid }}"
  when: not (item.skipped | default(false))

# --- ACLs -------------------------------------------------------------------
- name: Query current ACLs
  ansible.builtin.command: pveum acl list --output-format json
  register: pve_acl_raw
  changed_when: false
  check_mode: false

- name: Apply ACL grants (when missing)
  ansible.builtin.command: >-
    pveum acl modify {{ item.path }} --roles {{ item.role }}
    --{{ {'user': 'users', 'token': 'tokens', 'group': 'groups'}[item.type] }} {{ item.id }}
  loop: "{{ pve_api_acls }}"
  loop_control:
    label: "{{ item.path }} · {{ item.role }} · {{ item.id }}"
  when: >-
    (pve_acl_raw.stdout | from_json
       | selectattr('path', 'equalto', item.path)
       | selectattr('roleid', 'equalto', item.role)
       | selectattr('ugid', 'equalto', item.id)
       | list | length) == 0
  changed_when: true
