- name: Create directory
  ansible.builtin.file:
    path: '{{ docker_compose_dir }}/pve_exporter'
    state: directory
    mode: '0755'

- name: Copy pve.yml config
  ansible.builtin.template:
    src: pve.yml.j2
    dest: '{{ docker_compose_dir }}/pve_exporter/pve.yml'
    mode: '0644'

- name: Deploy via Podman Quadlet
  ansible.builtin.include_tasks: podman.yaml
