- name: Ensure Quadlet directory exists
  ansible.builtin.file:
    path: /etc/containers/systemd
    state: directory
    mode: "0755"

- name: Deploy pve_exporter Quadlet unit
  ansible.builtin.template:
    src: pve_exporter.container
    dest: /etc/containers/systemd/pve_exporter.container
    mode: "0644"
  register: pve_exporter_quadlet

- name: Start pve_exporter
  ansible.builtin.systemd:
    name: pve_exporter.service
    state: "{{ 'restarted' if pve_exporter_quadlet.changed else 'started' }}"
    daemon_reload: true
