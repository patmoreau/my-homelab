---
# NFS shares from the NAS, reached over the vmbr1 direct link (192.168.50.x).
pve_nfs_server: 192.168.50.1
pve_nfs_content: rootdir
pve_nfs_stores:
# nas-books is deliberately absent. It was a second export nested at /media/books inside
# lxc-media, and two mounts are two devices to the kernel, so rename(2) and link(2) between
# the downloads and the book library failed with EXDEV. The books tree now lives inside the
# nas-media share at media/books. The role only ever adds storages, so removing this entry
# does not detach it: run `pvesm remove nas-books` on the host once.
  - { name: nas-media, export: /media }
  - { name: nas-photos, export: /photos }
  - { name: nas-backups, export: /backups }

# Seconds pve-guests waits at boot for every store above to be mounted before starting
# guests regardless (roles/pve_storage/templates/pve-wait-nas-storage.sh.j2).
pve_nas_wait_timeout: 300
