- name: Copy docker-compose.yaml
  ansible.builtin.template:
    src: docker-compose.yaml
    dest: "{{ docker_compose_dir }}/service-watcher/docker-compose.yaml"
    mode: "0644"

- name: Create .env file
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ docker_compose_dir }}/service-watcher/.env"
    mode: "0600"

- name: Build image
  community.docker.docker_compose_v2:
    project_src: "{{ docker_compose_dir }}/service-watcher"
    build: always
    state: present
  when: dockerfile_changed.changed or packagejson_changed.changed or src_changed.changed

- name: Start
  community.docker.docker_compose_v2:
    project_src: "{{ docker_compose_dir }}/service-watcher"
    state: present
