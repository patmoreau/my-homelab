- name: Create gateway network
  community.docker.docker_network:
    name: gateway
    state: present

- name: Copy docker-compose.yaml
  ansible.builtin.template:
    src: docker-compose.yaml
    dest: '{{ docker_compose_dir }}/traefik/docker-compose.yaml'
    mode: '0644'

- name: Copy docker-compose.override.yaml
  ansible.builtin.template:
    src: docker-compose.override.yaml.j2
    dest: '{{ docker_compose_dir }}/traefik/docker-compose.override.yaml'
    mode: '0644'

- name: Copy .env file
  ansible.builtin.template:
    src: .env.j2
    dest: '{{ docker_compose_dir }}/traefik/.env'
    mode: '0600'

- name: Start
  community.docker.docker_compose_v2:
    project_src: '{{ docker_compose_dir }}/traefik'
    state: present
