- name: Create gateway network
  community.docker.docker_network:
    name: gateway
    state: present

- name: Create directory
  ansible.builtin.file:
    path: '{{ docker_compose_dir }}/traefik'
    state: directory
    mode: '0755'

- name: Create conf.d directory
  ansible.builtin.file:
    path: '{{ docker_compose_dir }}/traefik/conf.d'
    state: directory
    mode: '0755'

- name: Copy traefik.yaml
  ansible.builtin.template:
    src: traefik.yaml.j2
    dest: '{{ docker_compose_dir }}/traefik/traefik.yaml'
    mode: '0644'

- name: Copy docker-compose.yaml
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: '{{ docker_compose_dir }}/traefik/docker-compose.yaml'
    mode: '0644'

- name: Copy .env file
  ansible.builtin.template:
    src: .env.j2
    dest: '{{ docker_compose_dir }}/traefik/.env'
    mode: '0600'

- name: Copy conf.d files
  ansible.builtin.template:
    src: 'conf.d/{{ item }}.j2'
    dest: '{{ docker_compose_dir }}/traefik/conf.d/{{ item }}'
    mode: '0644'
  loop:
    - global.yaml
    - calibre.yaml
    - essere.yaml
    - filebrowser.yaml
    - ghost.yaml
    - grafana.yaml
    - homeassistant.yaml
    - homepage.yaml
    - immich.yaml
    - jellyfin.yaml
    - pbs.yaml
    - prometheus.yaml
    - service-watcher.yaml
    - traefik.yaml
    - transmission.yaml
    - vaultwarden.yaml

- name: Generate certs-dumper SSH deploy key (if absent)
  community.crypto.openssh_keypair:
    path: '{{ docker_compose_dir }}/traefik/certs-dumper-key'
    type: ed25519
    comment: traefik-certs-dumper@lxc-gateway
    mode: '0600'
  register: certs_dumper_keypair

- name: Ensure acme.json exists with correct permissions
  ansible.builtin.file:
    path: '{{ docker_compose_dir }}/traefik/acme.json'
    state: touch
    mode: '0600'
    modification_time: preserve
    access_time: preserve

- name: Start
  community.docker.docker_compose_v2:
    project_src: '{{ docker_compose_dir }}/traefik'
    state: present
