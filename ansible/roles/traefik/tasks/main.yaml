- name: Create directory
  ansible.builtin.file:
    path: '{{ docker_compose_dir }}/traefik'
    state: directory
    mode: '0755'

- name: Create conf.d directory
  ansible.builtin.file:
    path: '{{ docker_compose_dir }}/traefik/conf.d'
    state: directory
    mode: '0755'

- name: Create certs directory
  ansible.builtin.file:
    path: '{{ docker_compose_dir }}/traefik/certs'
    state: directory
    mode: '0755'

- name: Copy traefik.yaml
  ansible.builtin.template:
    src: traefik.yaml.j2
    dest: '{{ docker_compose_dir }}/traefik/traefik.yaml'
    mode: '0644'

- name: Copy conf.d files
  ansible.builtin.template:
    src: 'conf.d/{{ item }}.j2'
    dest: '{{ docker_compose_dir }}/traefik/conf.d/{{ item }}'
    mode: '0644'
  loop:
    - global.yaml
    - bookorbit.yaml
    - essere.yaml
    - filebrowser.yaml
    - grafana.yaml
    - holefeeder.yaml
    - homeassistant.yaml
    - homepage.yaml
    - immich.yaml
    - jellyfin.yaml
    - nas.yaml
    - pbs.yaml
    - pve.yaml
    - prometheus.yaml
    - service-watcher.yaml
    - router.yaml
    - traefik.yaml
    - transmission.yaml
    - vaultwarden.yaml

- name: Generate certs-dumper SSH deploy key (if absent)
  community.crypto.openssh_keypair:
    path: '{{ docker_compose_dir }}/traefik/certs-dumper-key'
    type: ed25519
    comment: traefik-certs-dumper@lxc-gateway
    mode: '0600'
  register: traefik_certs_dumper_keypair

- name: Ensure acme.json exists with correct permissions
  ansible.builtin.file:
    path: '{{ docker_compose_dir }}/traefik/acme.json'
    state: touch
    mode: '0600'
    modification_time: preserve
    access_time: preserve

- name: Deploy via Docker Compose
  ansible.builtin.include_tasks: docker.yaml
  when: container_runtime == 'docker'

- name: Deploy via Podman Quadlet
  ansible.builtin.include_tasks: podman.yaml
  when: container_runtime == 'podman'
