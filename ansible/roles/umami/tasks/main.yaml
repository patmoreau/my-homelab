- name: Create project folder
  ansible.builtin.file:
    path: '{{ docker_compose_dir }}/umami'
    state: directory
    mode: '0755'

# Umami reuses the essere Postgres container rather than running a second one. That
# container only ever creates POSTGRES_DB (directus) on first boot, so the umami
# database has to be created out of band. Umami builds its own schema on first start.
- name: Create the umami database in the essere Postgres
  ansible.builtin.command:
    cmd: >-
      podman exec essere_postgres
      psql -U {{ postgres_user }} -d postgres -tAc
      "SELECT 1 FROM pg_database WHERE datname = '{{ umami_db_name }}'"
  register: umami_db_check
  changed_when: false

- name: Create the umami database when missing
  ansible.builtin.command:
    cmd: >-
      podman exec essere_postgres
      createdb -U {{ postgres_user }} {{ umami_db_name }}
  when: umami_db_check.stdout | trim != '1'
  changed_when: true

- name: Deploy via Podman Quadlet
  ansible.builtin.include_tasks: podman.yaml
