- name: Create folder
  ansible.builtin.file:
    path: "{{ docker_compose_dir }}/vaultwarden"
    state: directory
    mode: "0755"

- name: Create volume folders
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0777"
  loop:
    - /data/vaultwarden
    - /data/vaultwarden/data
    - /data/vaultwarden/mariadb

- name: Copy docker-compose.yaml
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ docker_compose_dir }}/vaultwarden/docker-compose.yaml"
    mode: "0644"

- name: Copy .env file
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ docker_compose_dir }}/vaultwarden/.env"
    mode: "0600"

- name: Start
  community.docker.docker_compose_v2:
    project_src: "{{ docker_compose_dir }}/vaultwarden"
    state: present
