---
# Which side of the comparison this host is. `protected` hosts are routed through the VPN
# by the router's per-MAC policy; a `baseline` host is deliberately outside it, so its exit
# address is the home ISP address. The Grafana rule raises a leak when a protected host
# reports the same exit address as the baseline. Set `baseline` in host_vars.
vpn_egress_side: protected

# Where the exit address is looked up. Unauthenticated ipinfo.io allows ~1000 requests a
# day per source address; the timer below uses 144 of them on each host.
vpn_egress_lookup_url: https://ipinfo.io/json
vpn_egress_interval: 10min
