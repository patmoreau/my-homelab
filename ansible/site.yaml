- name: Provision all LXC
  hosts: lxc:!lxc-pbs
  roles:
    - docker
    - node_exporter
    - cadvisor
    - proxmox-backup-client

- name: Deploy Gateway
  hosts: lxc-gateway
  roles:
    - traefik
    - cloudflare

- name: Deploy Media
  hosts: lxc-media
  roles:
    - calibre
    - jellyfin
    - transmission
    - filebrowser
    - service-watcher

- name: Deploy Essere
  hosts: lxc-essere
  roles:
    - essere

- name: Deploy Monitoring
  hosts: lxc-monitoring
  roles:
    - prometheus
    - loki
    - grafana

- name: Deploy Tools
  hosts: lxc-tools
  roles:
    - homepage

- name: Deploy Vault
  hosts: lxc-vault
  roles:
    - vaultwarden

- name: Deploy Immich
  hosts: lxc-immich
  roles:
    - immich

- name: Deploy Promtail
  hosts: lxc:!lxc-monitoring:!lxc-pbs
  roles:
    - promtail

- name: Deploy Home Assistant
  hosts: lxc-homeassistant
  roles:
    - homeassistant

- name: Deploy Proxmox Backup Server
  hosts: lxc-pbs
  roles:
    - proxmox-backup-server
