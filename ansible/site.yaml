- name: Provision all LXC
  hosts: lxc
  roles:
    - docker
    - node_exporter
    - cadvisor

- name: Deploy Gateway
  hosts: lxc-gateway
  roles:
    - traefik
    - cloudflare

- name: Deploy Media
  hosts: lxc-media
  roles:
    - calibre
    - jellyfin
    - transmission
    - filebrowser
    - service-watcher

- name: Deploy Essere
  hosts: lxc-essere
  roles:
    - essere

- name: Deploy Monitoring
  hosts: lxc-monitoring
  roles:
    - prometheus
    - loki
    - grafana

- name: Deploy Tools
  hosts: lxc-tools
  roles:
    - homepage

- name: Deploy Vault
  hosts: lxc-vault
  roles:
    - vaultwarden

- name: Deploy Promtail
  hosts: lxc:!lxc-monitoring
  roles:
    - promtail
