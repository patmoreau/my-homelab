- name: Deploy Proxmox Backup Server
  hosts: lxc-pbs
  roles:
    - proxmox-backup-server

- name: Provision all LXC
  hosts: lxc:!lxc-pbs:!lxc-tools:!lxc-monitoring:!lxc-vault:!lxc-media:!lxc-immich:!lxc-homeassistant:!lxc-gateway:!lxc-essere:!lxc-holefeeder
  roles:
    - docker
    - node_exporter
    - cadvisor

- name: Provision Podman LXC
  hosts: lxc-tools:lxc-monitoring:lxc-vault:lxc-media:lxc-immich:lxc-homeassistant:lxc-gateway:lxc-essere:lxc-holefeeder
  roles:
    - podman
    - node_exporter
    - cadvisor

- name: Deploy Gateway
  hosts: lxc-gateway
  roles:
    - traefik
    - cloudflare

- name: Deploy Media
  hosts: lxc-media
  roles:
    - book-orbit
    - jellyfin
    - transmission
    - filebrowser
    - service-watcher
    - proxmox-backup-client

- name: Deploy Essere
  hosts: lxc-essere
  roles:
    - github-runner
    - essere
    - proxmox-backup-client

- name: Deploy Monitoring
  hosts: lxc-monitoring
  roles:
    - prometheus
    - loki
    - grafana
    - pve_exporter
    - blackbox_exporter
    - proxmox-backup-client

- name: Deploy Tools
  hosts: lxc-tools
  roles:
    - homepage

- name: Deploy Vault
  hosts: lxc-vault
  roles:
    - vaultwarden
    - proxmox-backup-client

- name: Deploy Immich
  hosts: lxc-immich
  roles:
    - immich
    - proxmox-backup-client

- name: Deploy Holefeeder
  hosts: lxc-holefeeder
  roles:
    - github-runner
    - holefeeder
    - proxmox-backup-client

- name: Deploy Promtail
  hosts: lxc:!lxc-monitoring:!lxc-pbs
  roles:
    - promtail

- name: Deploy Home Assistant
  hosts: lxc-homeassistant
  roles:
    - homeassistant
    - proxmox-backup-client
