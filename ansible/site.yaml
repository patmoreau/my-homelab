- name: Deploy Proxmox Backup Server
  hosts: lxc-pbs
  roles:
    # Not the Quadlet node_exporter the other LXCs get — lxc-pbs is excluded from the Podman
    # provisioning plays, and its exporter was a hand-installed binary that no playbook knew
    # about, so a rebuild would have lost it along with the datastore metrics.
    - node_exporter_pkg
    - proxmox-backup-server

- name: Provision all LXC
  hosts: lxc:!lxc-pbs:!lxc-tools:!lxc-monitoring:!lxc-vault:!lxc-media:!lxc-immich:!lxc-homeassistant:!lxc-gateway:!lxc-essere:!lxc-holefeeder
  roles:
    - journald
    - docker
    - node_exporter
    - cadvisor

- name: Provision Podman LXC
  hosts: lxc-tools:lxc-monitoring:lxc-vault:lxc-media:lxc-immich:lxc-homeassistant:lxc-gateway:lxc-essere:lxc-holefeeder
  roles:
    - journald
    - podman
    - node_exporter
    - cadvisor

- name: Deploy Gateway
  hosts: lxc-gateway
  roles:
    # oauth2-proxy before traefik: traefik's routers reference it as forwardAuth, and a
    # router whose auth backend is not listening fails closed on every request.
    - oauth2-proxy
    - traefik
    - cloudflare

- name: Deploy Media
  hosts: lxc-media
  roles:
    - jellyfin
    - transmission
    - radarr
    - sonarr
    # After prowlarr: book-orbit registers it as an indexer source over the API, and that
    # call is refused until prowlarr's AllowedHosts carries the bridge address it arrives on.
    - prowlarr
    - book-orbit
    - vpn_egress_check
    - filestash
    - service-watcher
    - proxmox-backup-client

- name: Deploy Essere
  hosts: lxc-essere
  roles:
    - github-runner
    - essere
    - umami
    - proxmox-backup-client

- name: Deploy Monitoring
  hosts: lxc-monitoring
  roles:
    - prometheus
    - loki
    - grafana
    - pve_exporter
    - blackbox_exporter
    # Baseline side of the VPN leak check: its exit is the home ISP address.
    - vpn_egress_check
    - proxmox-backup-client

- name: Deploy Tools
  hosts: lxc-tools
  roles:
    - homepage

- name: Deploy Vault
  hosts: lxc-vault
  roles:
    - vaultwarden
    - proxmox-backup-client

- name: Deploy Immich
  hosts: lxc-immich
  roles:
    - immich
    - proxmox-backup-client

- name: Deploy Holefeeder
  hosts: lxc-holefeeder
  roles:
    - github-runner
    - holefeeder
    - proxmox-backup-client

- name: Deploy Promtail
  hosts: lxc:!lxc-monitoring:!lxc-pbs
  roles:
    - promtail

- name: Deploy Home Assistant
  hosts: lxc-homeassistant
  roles:
    - homeassistant
    - proxmox-backup-client
