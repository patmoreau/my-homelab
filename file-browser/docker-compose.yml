services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.filebrowser.rule=Host(`filebrowser.homelab.lan`)"
      - "traefik.http.services.filebrowser.loadbalancer.server.port=80"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /mnt/nas-docker-data/filebrowser/data:/srv
      - /mnt/nas-docker-data/filebrowser/config:/config
      - /mnt/nas-docker-data/filebrowser/database:/database
      - /mnt/nas-books:/srv/nas-books
      - /mnt/nas-docker-data:/srv/nas-docker-data
      - /mnt/nas-media:/srv/nas-media
    restart: unless-stopped
    networks:
      - traefik-public

networks:
  traefik-public:
    external: true
