api:
  dashboard: true
  insecure: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  docker:
    exposedByDefault: false
  file:
    directory: /etc/traefik/conf.d
    watch: true

certificatesResolvers:
  myresolver:
    acme:
      email: patrick@drifterapps.com
      storage: acme.json
      httpChallenge:
        entryPoint: web
