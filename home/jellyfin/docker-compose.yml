services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    ports:
      - 8096:8096
    labels:
      - traefik.enable=true
      - traefik.http.routers.jellyfin-http.rule=Host(`jellyfin.homelab.lan`)
      - traefik.http.routers.jellyfin-http.entrypoints=web
      - traefik.http.routers.jellyfin-http.priority=100
      - traefik.http.services.jellyfin-http.loadbalancer.server.port=8096
      - kop.bind.ip=${HOST}
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - JELLYFIN_PublishedServerUrl=jellyfin.homelab.lan
    volumes:
      - /mnt/nas-docker-data/jellyfin/config:/config
      - /mnt/nas-media:/data/movies:ro
    restart: unless-stopped
