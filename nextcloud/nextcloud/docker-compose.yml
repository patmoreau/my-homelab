services:
  db:
    image: mariadb:10.11
    container_name: nextcloud_db
    restart: always
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    volumes:
      - /mnt/nas-docker-data/nextcloud-vm/db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}

  redis:
    image: redis:alpine
    container_name: nextcloud_redis
    restart: always

  app:
    image: nextcloud:latest
    container_name: nextcloud_app
    restart: always
    ports:
      - 80:80
    depends_on:
      - db
      - redis
    labels:
      - traefik.enable=true
      - traefik.http.routers.nextcloud-http.rule=Host(`nextcloud.homelab.lan`)
      - traefik.http.routers.nextcloud-http.entrypoints=web
      - traefik.http.routers.nextcloud-http.priority=100
      - traefik.http.services.nextcloud-http.loadbalancer.server.port=80
      - kop.bind.ip=${HOST}
    volumes:
      - /mnt/nas-docker-data/nextcloud-vm/nextcloud:/var/www/html
      - /mnt/nas-nextcloud:/var/www/html/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_HOST=db
      - REDIS_HOST=redis
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
